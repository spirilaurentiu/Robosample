name: robo_py312
channels:
  - conda-forge
dependencies:
  # Build tools
  - compilers
  - cmake
  - ninja
  - pkg-config

  # Python
  - python=3.12
  - pip

  # Nvidia and OpenCL
  - nvidia::cuda-toolkit=12.8
  - ocl-icd
  - opencl-headers
  - clinfo

  # Bioinformatics
  - openmm
  - openmmtools
  - dacase::ambertools-dac=25
  - salilab::modeller
  - rdkit
  - openbabel
  - parmed
  - mdtraj
  - mdanalysis
  - biopython
  - pymol-open-source

  # Scientific computing and data analysis
  - numpy
  - scipy
  - pandas
  - matplotlib
  - seaborn
  - astropy
  - networkx
  - tqdm

  # Pip packages
  - pip:
    - pybind11-stubgen
    - rcsbsearchapi
    - pdb2pqr