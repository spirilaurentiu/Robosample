    - "GNEIMO -- generalized Newton-Euler inverse mass operator method; spatial-operator algebra giving O(N) equations of motion instead of O(N^3)"
    - "Fixman compensating potential U_f -- corrects partition-function bias from treating stiff bond/angle DOF as rigid"
    - "Coupled ICMD equations of motion -- M(theta) thetaddot + C(theta,thetadot) = T(theta), with C the Coriolis term"
    - "Cluster / dynamic clustering -- rigid bodies (atom to whole domain) connected by 1-6 DOF hinges, frozen/thawed on the fly"
    - "Modal coordinates -- noncanonical velocities enabling an ICMD equipartition principle for correct velocity initialization"
    - "Constrained ICMD is not the stiff-Cartesian limit -- rigid constraints alter the PES/FES and dihedral transition rates"
  key_equations:
    - "Equations of motion: M(theta) thetaddot + C(theta,thetadot) = T(theta)"
    - "Spatial-operator acceleration: thetaddot = [I - H psi K]^T D^-1 [T - H psi(K T + P a + b)] - K^T psi^T a"
    - "Fixman potential: U_f(theta) = (1/2) kT ln( det{M(theta)} / det{M_B(theta, q_0)} )"
    - "Nose-Hoover ICMD: M(theta) thetaddot + C(theta,thetadot) + F(theta,thetadot) = T(theta); etadot = (1/tau^2)(T/T_B - 1)"
  invariants:
    - "Treating stiff, uncoupled bond/angle DOF as rigid biases the probability density; the Fixman potential (ratio of det M of constrained vs full BAT mass matrix) must be added to recover the all-atom Cartesian distribution."
    - "Soft bond angles strongly coupled to torsions/nonbonded terms are NOT corrected by Fixman and should be left flexible (hybrid ICMD)."
    - "The dense mass matrix is never inverted directly; spatial-operator factorization gives O(N) cost."
    - "Freeze/thaw (dynamic clustering) can alter the simulated pathway, so it is valid only for conformational search, not for thermodynamics."
  summary: >
    A review of the GNEIMO internal-coordinate MD framework: BAT/torsional coordinates let high-frequency DOF be
    frozen for larger time steps and better low-frequency sampling, with spatial-operator algebra reducing the
    equations of motion from O(N^3) to O(N) without inverting the dense mass matrix M(theta). It stresses two
    bottlenecks and their fixes -- computational cost (GNEIMO) and the constraint-induced partition-function bias,
    corrected by the Fixman potential U_f = (1/2)kT ln(det M / det M_B) and its torque, validated on alanine
    dipeptide. Also presents the modal-coordinate equipartition for velocity initialization and enhanced sampling
    (REMD, aMD) in torsion space.
    Relevant to: the mass-metric M(q), Fixman/U_Jacobian correction, BAT/Z-matrix flexibility model, and the O(n) articulated-body engine.

- title: "Correcting for the free energy costs of bond or angle constraints in molecular dynamics simulations"
  authors: ["Konig, G.", "Brooks, B. R."]
  year: 2015
  venue: "Biochimica et Biophysica Acta (BBA) - General Subjects, 1850, 932-943"
  doi: "10.1016/j.bbagen.2014.09.001"
  path: references/papers/j.bbagen.2014.09.001.md
  tags: [constraints, free-energy, jacobian, shake, rattle, bar, normal-mode-analysis, fixman-related, qm-mm, sampling]
  key_terms:
    - "Constraint correction -- post-processing free energy cost of adding/removing a bond/angle constraint via harmonic analysis"
    - "SHAKE/RATTLE/LINCS/Shape -- constraint algorithms that rigidify fast DOF to allow larger time steps"
    - "Hard vs soft DOF -- hard (bond/angle, harmonic, correctable) treated as functions of soft (dihedral/translation/rotation) DOF, following Go-Scheraga"
    - "Reduced-basis harmonic analysis -- project full 3n x 3n Hessian into the constrained subspace C, eigendecompose to get force constants"
    - "Jacobian factor -- entropic term from internal-to-Cartesian transformation; J_r = r^2 for bonds, J_theta = sin(theta) for angles"
    - "Phase-space overlap -- variance of BAR free energy is tied to overlap; constraints increase overlap (e.g. 0.15% -> ~2%)"
    - "Bennett acceptance ratio (BAR) -- free energy estimator whose precision improves with overlap"
  key_equations:
    - "Harmonic oscillator free energy: G^ho = U_0 - beta^-1 ln sqrt(2 pi / (beta K))"
    - "Free energy of imposing constraint: Delta G_cons = Delta H + Delta G_harm + Delta G_Jacobian"
    - "Enthalpy (anharmonic, Newton-Raphson): Delta H ~ U'(q_cons)^2 / (2 U''(q_cons))"
    - "Vibrational entropy: Delta G_harm ~ beta^-1 ln sqrt(2 pi / (beta U''(q_cons)))"
    - "Reduced Hessian / gradient: H = C^T F C, g = C^T f, Lambda = U^T H U"
    - "Jacobian change on release: Delta G_Jacobian = -beta^-1 ln( product_i J_i^after / J_i^before ), with J_r = r_ik^2, J_theta = sin(theta_jkl)"
    - "Release free energy via Zwanzig: Delta G_rls = beta^-1 ln < exp(-beta Delta G_cons(x_cons)) >_cons"
  invariants:
    - "Releasing/imposing a constraint carries three free energy contributions -- enthalpy (>= 0), vibrational entropy (always negative), and a Jacobian term (either sign); all three matter and must not be dropped."
    - "The Jacobian factor accounts for internal-to-Cartesian measure (longer bonds/obtuse angles have more phase space) and is needed only for DOF that change."
    - "Correction is valid only for hard (near-harmonic) DOF close to the energy minimum and weakly coupled to soft DOF; soft DOF cannot be corrected this way without biasing the Boltzmann weight."
    - "Constraints raise BAR phase-space overlap, lowering free energy variance (precision ~ 1/sqrt(frames))."
  summary: >
    Provides a harmonic-analysis post-processing method to compute the free energy cost of bond/angle constraints
    (SHAKE), splitting it into enthalpy, vibrational entropy, and a Jacobian (internal-to-Cartesian) term with
    J_r = r^2 and J_theta = sin(theta), combined via the Zwanzig/exponential average over constrained samples.
    Treating hard DOF as harmonic functions of soft DOF (Go-Scheraga) it reaches near-machine-precision on
    analytic benchmarks and cuts free energy errors ~10x, while constraints raise BAR phase-space overlap and
    precision. The Jacobian and det-of-metric reasoning directly parallels the Fixman/U_Jacobian correction a
    constraint-based sampler must apply.
    Relevant to: SHAKE/RATTLE constraint handling, the Jacobian/U_Jacobian and Fixman corrections, and the dH used in the acceptance test.

- title: "Robosample: A rigid-body molecular simulation program based on robot mechanics"
  authors: ["Spiridon, L.", "Sulea, T. A.", "Minh, D. D. L.", "Petrescu, A.-J."]
  year: 2020
  venue: "Biochimica et Biophysica Acta (BBA) - General Subjects, 1864(8):129616"
