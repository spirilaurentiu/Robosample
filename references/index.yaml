- title: "Hamiltonian Monte Carlo with Constrained Molecular Dynamics as Gibbs Sampling"
  authors: ["Spiridon, L.", "Minh, D. D. L."]
  year: 2017
  venue: "Journal of Chemical Theory and Computation (Just Accepted)"
  doi: "10.1021/acs.jctc.7b00570"
  path: references/papers/acs.jctc.7b00570.md
  tags: [hmc, cdhmc, constrained-dynamics, fixman, gibbs-sampling, internal-coordinates, mass-metric, foundational]
  key_terms:
    - "CDHMC -- Hamiltonian Monte Carlo whose trial moves come from constrained (e.g. torsional) MD"
    - "mass metric tensor M_phi = J^T M J -- position-dependent generalized-coordinate mass matrix, J_kl = dq_k/dphi_l"
    - "Fixman potential -- compensating term that corrects constrained vs unconstrained marginal densities"
    - "Fixman torque -- gradient of the Fixman potential; shown to be unnecessary in the propagator"
    - "Gibbs sampling of constraints -- alternating torsional (CDHMC) and fully-flexible (UDHMC) moves to restore ergodicity"
    - "guidance vs acceptance potential -- dynamics may use U while acceptance uses U' = U + U_F (Duane et al.)"
    - "Shirts test -- log ratio of energy histograms at two temperatures must be linear with slope -(beta2-beta1)"
  key_equations:
    - "Marginal density: rho(phi) proportional to |M_phi|^(1/2) exp(-beta U(phi))"
    - "Fixman potential: U_F(phi_f) = (1/2) beta^-1 ln( |M_Nf| / |M_3N| )"
    - "Modified Hamiltonian: H'(phi,p) = (1/2) p^T M^-1 p + U(phi) + U_F(phi)"
    - "Acceptance: A = min(1, exp[-beta( H'(phi_N*,p_N*) - H'(phi_0*,p_0) )])"
    - "Initial momenta: p_0* ~ Normal(0, kB T * M^-1(phi))"
    - "Energy histogram (Shirts): ln[pi(U|beta2)/pi(U|beta1)] = ln[Z(beta1)/Z(beta2)] - (beta2-beta1) U"
  invariants:
    - "The Fixman potential MUST appear in the Metropolis-Hastings acceptance Hamiltonian; omitting it distorts the torsion-angle distribution."
    - "Constrained MD integrator must be reversible and satisfy constraints via projection (proj) on positions and momenta to tolerance eta."
    - "Acceptance uses exact dH of the (Fixman-corrected) Hamiltonian; the guidance potential may differ from the acceptance potential without biasing the stationary distribution, only lowering acceptance."
    - "Ergodicity requires alternating which DOF are constrained (Gibbs moves); a single fixed constraint set cannot sample all configuration space."
  summary: >
    The direct theoretical and algorithmic basis for Robosample: it implements HMC on
    constrained (torsional) molecular dynamics as a Gibbs-sampling move, using the Fixman
    potential in the acceptance test to recover the correct Boltzmann marginal |M_phi|^(1/2)
    exp(-beta U). It shows the Fixman torque can be dropped from the propagator (guidance
    vs acceptance Hamiltonian), that mixing constrained and fully-flexible moves restores
    ergodicity, and validates correctness via uniform torsion histograms, Shirts' test, and
    alanine-dipeptide free-energy landscapes. Relevant to: the CDHMC sampler, Fixman/mass-metric
    correction, acceptance test, and mixed/Gibbs move scheduling.

- title: "A Family of MCMC Methods on Implicitly Defined Manifolds"
  authors: ["Brubaker, M. A.", "Salzmann, M.", "Urtasun, R."]
