    - "Spatial operator algebra (Rodriguez/Jain) -- recursive O(n) articulated-body method; M and M^-1 applied as operators, never assembled"
    - "Differential equation on a manifold (DEM) -- constraints kept satisfied via the condition c=0 implies c_dot=0, enabling ODE integrators"
    - "Coordinate projection -- projects the integrated state back onto the constraint manifold (superior to Baumgarte stabilization; no gains to tune)"
    - "Acceleration constraint Jacobian G = [P V A]^T -- assembles holonomic/nonholonomic/acceleration-only constraints"
    - "System/State/Study + realization cache -- stateless model, all variability in State, staged invalidation of cached computations"
  key_equations:
    - "Time-stepper view: y_dot = f(d;t,y), 0 = c(d;t,y), 0 = e(d;t,y); DEM condition c=0 => c_dot=0"
    - "Kinematic differential equation: q_dot = N(q) u"
    - "Equations of motion: M u_dot + G^T lambda = f_applied - f_inertial"
    - "Constraint multiplier solve: G M^-1 G^T lambda = G u0_dot - b, with u0_dot = M^-1 (f_applied - f_inertial)"
    - "Least-squares (redundant-constraint) multipliers: lambda = Y^+ g0, Y = G M^-1 G^T"
    - "M^-1 v available in O(n); forming Y costs O(mn + m^2); multiplier solve O(m^3 + mn + m^2)"
  invariants:
    - "M(q) is the n-by-n symmetric positive-definite internal-coordinate mass matrix; it is never explicitly formed or inverted -- only the O(n) M^-1 operator is applied."
    - "Constraints kept on-manifold via DEM (c=0 => c_dot=0) plus coordinate projection normal to the manifold; projection both removes drift and reduces ODE error estimate."
    - "Minimal-coordinate internal joints (mobilizers) eliminate most constraints so n >> m, keeping the O(m^3) multiplier term negligible."
    - "Redundant constraints yield a least-squares (pseudoinverse) lambda so every redundant constraint carries part of the load rather than being dropped."
    - "f_inertial collects velocity-dependent Coriolis/gyroscopic generalized forces and must be subtracted in the acceleration solve."
  summary: >
    The architecture and multibody theory paper for Simbody, the O(n) spatial-operator-algebra
    engine underlying Robosample's articulated-body dynamics: tree of mobilized bodies with
    minimal internal coordinates, kinematic map q_dot = N(q)u, equations of motion
    M u_dot + G^T lambda = f_applied - f_inertial, and constraints handled as a differential
    equation on a manifold with coordinate projection and least-squares Lagrange multipliers.
    It establishes the load-bearing conventions Robosample inherits -- never assembling M, M^-1,
    or det M, applying them only as recursive O(n) operators, and the frame/constraint machinery.
    Relevant to: the O(n) multibody engine, mass-matrix operators, mobilizer/frame conventions, and constraint handling.

