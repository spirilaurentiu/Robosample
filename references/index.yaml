    chi1 surfaces. It demonstrates larger time steps (up to ~20 fs for simple peptides) and several-fold sampling
    gains, but warns that achievable time step is limited by collective torsion-space motion, not just energy
    conservation. Relevant to: the O(n) articulated-body mass-matrix operators and integrator/time-step choices for torsional worlds.

- title: "Quantum Mechanical Calculation of the Effects of Stiff and Rigid Constraints in the Conformational Equilibrium of the Alanine Dipeptide"
  authors: ["Echenique, P.", "Calvo, I.", "Alonso, J. L."]
  year: 2006
  venue: "Journal of Computational Chemistry, 27(14):1733-1747"
  doi: "10.1002/jcc.20467"
  path: references/papers/jcc.20467.md
  tags: [constraints, fixman, mass-metric-tensor, stiff-vs-rigid, jacobian, internal-coordinates, z-matrix, alanine-dipeptide, ab-initio, statistical-mechanics]
  key_terms:
    - "Stiff model -- constraints enforced by a steep potential; orthogonal (hard) velocities remain active as heat containers"
    - "Rigid model -- constraints treated as exact holonomic; orthogonal velocities vanish"
    - "Mass-metric tensor G -- G_{nu,rho} = sum_sigma (dx/dq^nu) m_sigma (dx/dq^rho); reduced tensor g restricted to soft+external coords"
    - "Fixman compensating potential -- correction added to rigid MD to reproduce the stiff equilibrium distribution"
    - "Soft vs hard coordinates -- soft = important (e.g. phi,psi); hard = constrained (bonds, angles, stiff dihedrals)"
    - "Hessian correction -- det H of the constraining potential w.r.t. hard coords contributes a configurational entropy term in the stiff model"
    - "SASMIC / Z-matrix coordinates -- branched internal coordinates giving a closed product form for det G"
  key_equations:
    - "Mass-metric tensor: G_{nu rho}(q) = sum_sigma (dx^sigma/dq^nu) m_sigma (dx^sigma/dq^rho)"
    - "Stiff free energy: F_s = V_Sigma(q^i) - T(S_s^c + S_s^k), with S_s^c = -(R/2) ln det H(q^i), S_s^k = (R/2) ln det G"
    - "Rigid free energy: F_r = V_Sigma(q^i) - T S_r^k, with S_r^k = (R/2) ln det g(q^u)"
    - "Fixman compensating potential: V_F = (RT/2) ln[ det G / ( det H * det g ) ]"
    - "Closed-form determinant: det G = (prod_alpha m_alpha^3) sin^2(theta) (prod_{alpha>=2} r_alpha^4)(prod_{alpha>=3} sin^2(theta_alpha))"
  invariants:
    - "Naive exp(-beta V_Sigma) is NOT the correct marginal density; det G, det g, and det H correction terms must be included or shown negligible."
    - "External (overall translation/rotation) coordinates factorize out of det G and det g, so the Fixman potential is independent of external coordinates."
    - "det G depends on bond lengths r_alpha and bond angles theta_alpha but not explicitly on dihedrals (only via hard coordinates)."
    - "Corrections are non-negligible over the full Ramachandran space but negligible within the low-energy secondary-structure region for peptides of considerable length."
  summary: >
    Derives, from first principles and with MP2 ab initio energies on the alanine dipeptide, the exact
    statistical-mechanics corrections that constraints impose on the internal-coordinate marginal density:
    the stiff vs rigid mass-metric determinants (det G, det g), the constraining-potential Hessian term
    (det H), and their combination as the Fixman compensating potential. It supplies the closed-form Z-matrix
    determinant of G and quantifies when these Jacobian/Fixman terms can be dropped. This is the rigorous
    theory behind the program's Fixman correction. Relevant to: Fixman potential/torque correctness and the mass-metric Jacobian terms in the acceptance test.

- title: "Advanced Techniques for Constrained Internal Coordinate Molecular Dynamics"
  authors: ["Wagner, J. R.", "Balaraman, G. S.", "Niesen, M. J. M.", "Larsen, A. B.", "Jain, A.", "Vaidehi, N."]
