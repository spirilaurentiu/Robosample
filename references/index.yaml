  tags: [hmc, constrained-hmc, manifold, detailed-balance, rattle, symplectic, mass-metric, theory]
  key_terms:
    - "CHMC -- Constrained Hamiltonian Monte Carlo on a manifold M = {q : c(q)=0}"
    - "constraint Jacobian C(q) = dc/dq -- assumed full rank everywhere; defines tangent/cotangent spaces"
    - "acceptance vs guidance Hamiltonian -- H accepts (encodes target), H-hat (any potential) only guides simulation"
    - "RATTLE -- symmetric, symplectic, order-2 constrained integrator generalizing Leapfrog to manifolds"
    - "momentum projection -- draw p ~ Normal(0,M(q)) then project onto cotangent space C(q) M^-1 p = 0"
    - "state-dependent mass matrix M(q) -- naturally handled, generalizing Riemann-manifold HMC"
  key_equations:
    - "Hamiltonian: H(p,q) = (1/2) p^T M(q)^-1 p + U(q) + lambda^T c(q)"
    - "Acceptance potential: U(q) = (1/2) log|M(q)| - log pi(q), so exp(-H) = pi(q) Normal(p|0,M(q))"
    - "Acceptance: min(1, exp{ H(p_0,q_0) - H(p_L,q_L) })"
    - "Symplectic condition: F(x)^T J F(x) = J, implying det(F)^2 = 1 (volume preservation)"
    - "Detailed balance: integral pi(q) T(q->q') = integral pi(q') T(q'->q)"
  invariants:
    - "Integrator must be symmetric, symplectic, and consistent (order r>=1) and respect both position constraints c(q)=0 and momentum constraints C(q) dH/dp = 0."
    - "Volume preservation plus symmetry (rho-reversibility under (p,q)->(-p,q)) yield detailed balance regardless of the guidance Hamiltonian."
    - "The (1/2)log|M(q)| term in the acceptance potential is required so the position marginal equals pi(q); convergence also needs connectivity, full-rank C, positive-definite M, and strictly positive smooth pi."
  summary: >
    Generalizes HMC to sample distributions defined on implicit constraint manifolds,
    proving detailed balance, irreducibility, aperiodicity, and convergence given a
    symmetric/symplectic/consistent constrained integrator (RATTLE) and the explicit
    separation of an acceptance Hamiltonian from an arbitrary guidance Hamiltonian. Its
    acceptance potential U = (1/2)log|M(q)| - log pi(q) is precisely the mass-metric
    (Fixman-type) Jacobian correction Robosample must apply, and it formalizes the
    momentum-projection and reversibility requirements. Relevant to: the constrained-HMC
    proposal, RATTLE/SHAKE integrator correctness proofs, mass-metric acceptance term,
    and detailed-balance guarantees.

