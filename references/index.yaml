    - "Kinetic energy in dihedral momenta: K_r = (1/2) P^T G P with G = (H0)^-1 = G0 - G' (G'')^-1 (G')^T"
    - "Jacobian: D = [det G * det G'' * (product m_k)^3]^(-1/2)"
