    grid-based receptor-ligand interactions and temperature, combining Hamiltonian Monte Carlo,
    external-coordinate MC moves, and Hamiltonian replica exchange with states adaptively spaced by
    thermodynamic length and estimated by MBAR/FEP. It is a worked example of multi-state alchemical
