# Robosample literature index
# One entry per paper in references/papers/*.md. ASCII only.
# Fields:
#   summary       - 2-4 sentences: the gist and why it matters to our HMC/internal-coordinate sampler
#   tags          - short topic keywords
#   key_terms     - concepts/definitions the paper introduces
#   key_equations - named equations the program must obey, short ASCII form
#   invariants    - obligations those equations impose on the code (Rule 8 tests)
#   path          - path to the full .md
# Greek/symbols are spelled out (beta, lambda, Delta, ...). Some sources are OCR-garbled.

papers:

- title: "Numerical Integration of the Cartesian Equations of Motion of a System with Constraints: Molecular Dynamics of n-Alkanes"
  authors: ["Ryckaert, J.-P.", "Ciccotti, G.", "Berendsen, H. J. C."]
  year: 1977
  venue: "Journal of Computational Physics"
  doi: "10.1016/0021-9991(77)90098-5"
  path: references/papers/0021-9991_2877_2990098-5.md
  tags: [constraints, shake, molecular-dynamics, holonomic, lagrange-multipliers, cartesian, n-alkanes, verlet]
  key_terms:
    - "Holonomic constraint sigma_k -- bond/angle distance condition (r_i - r_j)^2 - d_ij^2 = 0 that must hold at every step"
    - "Lagrange multipliers lambda_k -- time-dependent coefficients giving the constraint forces G_i = -sum_k lambda_k grad_i sigma_k"
    - "Method of undetermined parameters gamma_k -- replaces the highest-order lambda derivative so constraints are satisfied exactly each step"
    - "SHAKE -- iterative procedure that enforces each constraint in succession, cycling until all satisfied within tolerance"
    - "Constraint force direction -- correction displacement of atom i is along the bond vector r_ij, equal and opposite on i and j"
  key_equations:
    - "Constrained EOM: m_i*r_i_ddot = F_i - sum_k lambda_k*grad_i(sigma_k)"
    - "Constraint: sigma_k = (r_i - r_j)^2 - d_ij^2 = 0"
    - "Verlet step: r(t+h) = 2*r(t) - r(t-h) + h^2*F(t)/m"
    - "Position correction: delta_r_i = (h^2/m_i)*sum_k gamma_k*grad_i(sigma_k) = -(2 h^2/m_i)*sum_k gamma_k*r_ij"
    - "SHAKE per-constraint multiplier (1st order): g = (s^2 - d^2)/(2*(r.r')*(1/m_i + 1/m_j)), corrections +/- g*r_ij/m applied to i,j"
  invariants:
    - "Every constraint sigma_k must equal zero (within tolerance tol) at each integration step, not just initially."
    - "Constraint corrections preserve the local truncation order of the integrator (O(h^3) per Verlet step); they must not add error beyond the algorithm's own."
    - "Constraint forces are central: equal magnitude, opposite sign, directed along the constrained bond (g_ij = g_ji), zero for non-constrained pairs."
    - "SHAKE iteration must loop over all constraints repeatedly until the max violation is below tolerance, since satisfying one constraint perturbs others."
  summary: >
    Introduces constrained Cartesian molecular dynamics via Lagrange multipliers and the practical
    iterative SHAKE algorithm, which freezes fast bond/angle degrees of freedom while keeping atomic
    Cartesian coordinates. The key idea is to replace the exact constraint forces with undetermined
    parameters chosen so the holonomic constraints hold exactly at the end of each step, at the same
    order of accuracy as the unconstrained Verlet integrator. This is the foundational reference for
    any constraint-projected proposal and for the rigid-bond/rigid-angle reduction underlying BAT/Z-matrix
    models. Relevant to: constraint solver (SHAKE), constrained-dynamics proposals, internal-coordinate reduction.

- title: "Rattle: A 'Velocity' Version of the Shake Algorithm for Molecular Dynamics Calculations"
  authors: ["Andersen, H. C."]
  year: 1983
  venue: "Journal of Computational Physics"
  doi: "10.1016/0021-9991(83)90014-1"
  path: references/papers/0021-9991_2883_2990014-1.md
  tags: [constraints, rattle, shake, velocity-verlet, molecular-dynamics, holonomic, lagrange-multipliers]
  key_terms:
    - "RATTLE -- velocity-Verlet form of constrained dynamics that propagates (r,v) at t to (r,v) at t+h without history"
    - "Velocity constraint -- time derivative of the position constraint: (r_i_dot - r_j_dot).(r_i - r_j) = 0"
    - "Two separate constraint approximations -- g_RR enforces position constraints, g_RV enforces velocity constraints, allowed because position and velocity steps may use different multipliers"
    - "Position-velocity constraint pair -- positions satisfy sigma=0 and velocities satisfy d/dt(sigma)=0 to tolerance at every step"
  key_equations:
    - "Velocity-Verlet position: r(t+h) = r(t) + h*r_dot(t) + (h^2/2m)*[F(t) - 2*sum_j lambda_RR_ij*r_ij(t)]"
    - "Velocity-Verlet velocity: r_dot(t+h) = r_dot(t) + (h/2m)*[F(t) - 2*sum_j lambda_RR_ij*r_ij(t) + F(t+h) - 2*sum_j lambda_RV_ij*r_ij(t+h)]"
    - "Position constraint: |r_i - r_j|^2 - d_ij^2 = 0"
    - "Velocity constraint: r_ij(t+h).(r_i_dot - r_j_dot)(t+h) = 0"
    - "Velocity multiplier: k = r_ij.(r_i_dot - r_j_dot) / (d_ij^2*(1/m_i + 1/m_j))"
  invariants:
    - "At every step both the positions (sigma=0) and the velocities (sigma_dot=0) must satisfy the constraints to tolerance."
    - "Global error remains O(h^2), local error O(h^3), identical to velocity-Verlet for unconstrained dynamics."
    - "Algorithm must be self-contained: next (r,v) depend only on current (r,v), enabling momentum refreshment / thermostatting between steps."
    - "Position-stage and velocity-stage multipliers are distinct and solved by separate iterative passes."
  summary: >
    Recasts SHAKE in the velocity-Verlet framework so that velocities are explicit state variables and
    both coordinates and their time derivatives satisfy the constraints at each step. Because momenta
    appear explicitly and the step needs no prior history, RATTLE is the natural constraint integrator
    for methods that resample or rescale momenta between steps (thermostats, and Hybrid Monte Carlo
    momentum refreshment). The clean velocity-constraint projection is exactly what an HMC proposal on a
    constrained manifold needs to keep momenta tangent to the constraint surface. Relevant to: constrained
    HMC leapfrog/velocity-Verlet integrator, momentum projection onto the constraint manifold.

- title: "Derivation and Testing of Explicit Equations of Motion for Polymers Described by Internal Coordinates"
  authors: ["Mazur, A. K.", "Dorofeev, V. E.", "Abagyan, R. A."]
  year: 1991
  venue: "Journal of Computational Physics"
  doi: "10.1016/0021-9991(91)90210-C"
  path: references/papers/0021-9991_2891_2990210-c.md
  tags: [internal-coordinates, lagrangian, equations-of-motion, tree-topology, torsion-dynamics, mass-metric, biopolymers, z-matrix]
  key_terms:
    - "BKS-tree -- unified rigid-body tree representation of one or more branched non-cyclic molecules, with virtual atoms/bonds imposing tree topology"
    - "Generalized coordinates theta_k -- non-frozen internal coordinates (bond lengths, valence angles, torsion/phase angles) of the tree"
    - "Variable-type indicator S_i -- equals 1 for angular (rotation) variables, 0 for bond-length (translation) variables"
    - "Chain V_alpha -- ordered set of generalized coordinates that determine the position of atom alpha"
    - "Set d_k -- the atoms whose positions depend on variable theta_k (the outboard subtree moved by theta_k)"
    - "Variable ordering rule -- if one variable's motion moves another's unit vector, the mover gets the smaller index (inboard before outboard)"
  key_equations:
    - "Lagrange EOM: d/dt(dL/dtheta_k_dot) - dL/dtheta_k = 0"
    - "Atom velocity: r_alpha_dot = sum_i [S_i*e_i x (r_alpha - r_i_theta)*theta_i_dot + (1-S_i)*e_i*theta_i_dot]"
    - "Velocity Jacobian column: d(r_alpha_dot)/d(theta_k_dot) = S_k*e_k x r_alpha/k + (1-S_k)*e_k"
    - "Mass-metric system: sum_i a_ki*theta_i_ddot = -dU/dtheta_k - sum_i b_ki*theta_i_dot^2 - sum_i sum_m c_kim*theta_m_dot*theta_i_dot"
    - "Temperature from internal DOF: T = 2*<K>/(N*k_B), N = number of internal degrees of freedom"
  invariants:
    - "Energy, linear momentum, and angular momentum must be conserved along trajectories integrated in internal coordinates (verified by forward/backward runs)."
    - "Internal-coordinate trajectories of a fully unfrozen molecule must match traditional Cartesian MD."
    - "The mass-metric matrix a_ki (the inertia/mass tensor in internal coordinates) is configuration-dependent and must be re-formed and solved (here via Cholesky) each step."
    - "Variable numbering must respect the inboard-to-outboard ordering or the cross/Coriolis terms (b, c coefficients) are wrong."
  summary: >
    Derives general explicit Lagrangian equations of motion in internal coordinates (bond lengths,
    valence angles, torsions) for arbitrarily branched polymers organized as a rigid-body tree, allowing
    any subset of internal degrees of freedom to be frozen. The resulting configuration-dependent
    mass-metric matrix M(q) = a_ki and its Coriolis/centrifugal companions (b, c) are precisely the
    quantities a constrained internal-coordinate sampler must form and apply. Freezing fast vibrations
    permits much larger time steps, the same payoff that motivates internal-coordinate HMC moves.
    Relevant to: internal-coordinate (BAT/Z-matrix) engine, mass-metric M(q) construction, tree-topology multibody operators.

- title: "Algorithms for Macromolecular Dynamics and Constraint Dynamics"
  authors: ["van Gunsteren, W. F.", "Berendsen, H. J. C."]
  year: 1977
  venue: "Molecular Physics"
  doi: "10.1080/00268977700102571"
  path: references/papers/00268977700102571.md
  tags: [molecular-dynamics, constraints, shake, predictor-corrector, gear, verlet, integrators, macromolecules]
  key_terms:
    - "Constraint-dynamics validity conditions -- eliminated DOF must be frequency-separated from and weakly coupled to remaining motion"
    - "N-representation (Nordsieck) -- stores y and scaled derivatives; best for non-constraint dynamics and time-step changes"
    - "F-representation (force) -- stores positions, velocities, present/past forces; the representation that allows SHAKE to be embedded in predictor-corrector schemes"
    - "Constraint force split -- f_tot = f_free + f_constr, with f_constr recovered from SHAKE-reset positions"
    - "tol -- accuracy to which SHAKE satisfies constraints; chosen so constraint error stays below integrator truncation error"
  key_equations:
    - "EOM: d^2 r_i/dt^2 = F_i/m_i, F_i = -grad_i V"
    - "Predictor: y_(n+1,p) = A*y_n; Corrector: y_(n+1) = y_(n+1,p) + a*(h^2/2)*[f(y_(n+1,p)) - y''_(n+1,p)]"
    - "Verlet: y_(n+1) = 2*y_n - y_(n-1) + h^2*y''_n; y'_n = (y_(n+1) - y_(n-1))/2h"
    - "Constraint force recovery: f_constr = [y_(n+1,tot) - y_(n+1,free)]/(b_0*(h^2/2))"
    - "Representation transform: B = T*A*T^-1, b = T*a"
  invariants:
    - "Constraint dynamics is only physically valid when the constrained (eliminated) frequencies are well separated from and weakly coupled to the retained ones."
    - "SHAKE tolerance tol must be set so the constraint violation is smaller than the integrator truncation error."
    - "For SHAKE embedding, the integrator must be in a representation (F-representation) whose stability coefficients b_i>2 vanish, so past y'' values are not retroactively altered."
    - "Bond-length constraints are recommended (~3x speedup); bond-angle constraints are not (frequencies not separable, SHAKE cost explodes)."
  summary: >
    Compares Verlet, Gear, and Beeman integrators for macromolecular MD (BPTI) and gives a general scheme
    for embedding SHAKE constraints inside multi-value predictor-corrector algorithms via the force
    representation. Establishes the practical rule that bond-length constraints are worthwhile but
    bond-angle constraints are not, and that constraints must satisfy frequency-separation/weak-coupling
    conditions to be physically legitimate. The constraint-tolerance-vs-truncation-error discipline and
    the constraint-force recovery scheme inform how a sampler should set SHAKE accuracy and validate
    constrained proposals. Relevant to: integrator selection, SHAKE tolerance settings, constraint legitimacy checks.

- title: "Generalized Coordinate Hybrid Monte Carlo"
  authors: ["Forrest, B. M.", "Suter, U. W."]
  year: 1994
  venue: "Molecular Physics"
  doi: "10.1080/00268979400100304"
  path: references/papers/00268979400100304.md
  tags: [hmc, hybrid-monte-carlo, generalized-coordinates, torsion-sampling, fixman, jacobian, fictitious-momenta, detailed-balance, leapfrog, polymers]
  key_terms:
    - "Generalized-coordinate HMC -- HMC on torsional DOF of rigid-bond/rigid-angle chains, sampling only the configurational integral"
    - "Fictitious momenta pi_k -- auxiliary angular momenta with freely chosen constant effective moments of inertia I_k, giving decoupled Cartesian-like EOM"
    - "Effective moment of inertia I_k -- constant coefficient that replaces the configuration-dependent inertia tensor; choosing I_k = <J_k> recovers a unique real time scale"
    - "Instantaneous moment of inertia J_k -- sum over moved beads of m_b*[e_k x (r_b - P_k)]^2 for rotation about axis e_k through P_k"
    - "Jacobian/Fixman factor D({q}) -- Cartesian-to-generalized Jacobian times the Fixman correction for the rigid (constrained) model; appears in the acceptance ratio"
    - "Guidance vs acceptance Hamiltonian -- the energy used to propagate may be fictitious, but the actual internal energy must be used in the acceptance dH"
  key_equations:
    - "Configurational average: <O> = (1/Z_q) integral dq D({q})*O({q})*exp(-E({q})/k_B T)"
    - "Metropolis acceptance (general gen-coord MC): P_acc = min{1, (P_S[n->o]*D(q_n)*exp(-E_n/kT)) / (P_S[o->n]*D(q_o)*exp(-E_o/kT))}"
    - "Augmented Hamiltonian: H_tilde = E({q}) + sum_k pi_k^2/(2*I_k)"
    - "Decoupled EOM: dpi_k/dt = -dE/dphi_k, dphi_k/dt = pi_k/I_k"
    - "HMC acceptance with Jacobian: P_acc = min{1, [prod_c sin(phi_2_n)/sin(phi_2_o)] * exp(-beta*dH_tilde)}"
    - "Identity: <[prod_c sin(phi_2_n)/sin(phi_2_o)]*exp(-dH_tilde/kT)> = 1"
    - "Time-scale mapping: Delta_t ~ ( <J_k>*<(Delta phi_k)^2> / k_B T )^(1/2)"
  invariants:
    - "The proposal integrator (leapfrog) must be time-reversible and phase-space volume preserving: [dq_o][dpi_o] = [dq_n][dpi_n]; other schemes need an extra Jacobian factor."
    - "Momenta must be refreshed from Maxwell-Boltzmann after every accept/reject decision (whether or not the move was accepted) or detailed balance fails."
    - "The acceptance test must use the EXACT internal energy in dH even if the propagating (guidance) energy is fictitious; a distorted proposal only lowers acceptance, never biases the stationary distribution."
    - "The configuration-space Jacobian factor D({q_n})/D({q_o}) (here the sin(phi_2) Euler-angle factor, and in full rigor the Fixman term) must multiply exp(-beta*dH) in the acceptance ratio."
    - "For any constant choice of effective moments of inertia I_k the algorithm remains canonical; only the sampling efficiency (not correctness) depends on I_k."
    - "A diagonal fictitious kinetic energy is required for volume preservation; a non-diagonal form introduces an extra Jacobian in the acceptance probability."
  summary: >
    Presents HMC in generalized (torsional) coordinates for rigid-bond/rigid-angle polymer chains,
    using fictitious diagonal momenta with constant effective moments of inertia to obtain decoupled,
    Cartesian-like, leapfrog-integrable equations of motion while still sampling the correct configurational
    distribution. It makes explicit that the acceptance ratio must carry the Cartesian-to-generalized
    Jacobian and Fixman correction D({q}), that momenta must be refreshed each step, and that the
    guidance Hamiltonian may differ from the exact-energy acceptance Hamiltonian (Duane et al.). This is
    the closest literature template for Robosample's internal-coordinate HMC, including the I_k = <J_k>
    choice that maps fictitious to real time and improves mixing. Relevant to: internal-coordinate HMC move,
    acceptance test with Jacobian/Fixman corrections, mass-metric / effective-inertia assignment, momentum refreshment.

- title: "Hybrid Monte Carlo"
  authors: ["Duane, S.", "Kennedy, A. D.", "Pendleton, B. J.", "Roweth, D."]
  year: 1987
  venue: "Physics Letters B 195(2), 216-222"
  doi: "10.1016/0370-2693(87)91197-X"
  path: references/papers/0370-2693_2887_2991197-x.md
  tags: [hmc, sampling, molecular-dynamics, detailed-balance, metropolis, leapfrog, lattice-field-theory]
  key_terms:
    - "Hybrid Monte Carlo (HMC) -- molecular-dynamics proposal followed by a Metropolis accept/reject on the whole configuration"
    - "guidance vs acceptance Hamiltonian -- H' drives the equations of motion, H defines the equilibrium distribution; they need not be equal"
    - "leapfrog integrator -- symplectic, exactly reversible and area-preserving map on phase space for any step size"
    - "momentum refreshment -- conjugate momenta drawn fresh from a unit Gaussian before each trajectory"
    - "reversibility -- P_H((q,p)->(q',p')) = P_H((q',-p')->(q,-p)), required for detailed balance"
    - "area preservation -- the proposal map has unit Jacobian so the measure dp dp' is invariant"
  key_equations:
    - "Hamiltonian: H(q,p) = (1/2) p^2 + S(q), with S the action (potential)"
    - "Acceptance: P_A = min(1, exp(-dH)), dH = H(q',p') - H(q,p)"
    - "Momentum draw: P_G(p) proportional to exp(-p^2/2)"
    - "Detailed balance: P_S(q) P_M(q->q') = P_S(q') P_M(q'->q)"
    - "Generalized Metropolis: P_A = min(1, P_S(q')P_C(q'->q) / (P_S(q)P_C(q->q')))"
  invariants:
    - "Proposal dynamics must be exactly reversible (momentum-flip symmetry)."
    - "Proposal map must be volume/area-preserving (unit Jacobian on phase space)."
    - "Momenta are refreshed from the exact Gaussian each iteration; H is invariant under p -> -p."
    - "The algorithm samples the correct distribution for ANY dH, even with a guidance potential that differs from the acceptance potential -- a distorted proposal only lowers acceptance, never biases the result."
  summary: >
    The founding HMC paper: a molecular-dynamics trajectory with refreshed Gaussian momenta proposes a
    global move that is accepted with min(1, exp(-dH)) of the exact Hamiltonian, eliminating finite-step-size
    discretization bias while keeping high acceptance. It proves detailed balance follows solely from
    reversibility plus volume preservation of the (leapfrog) integrator, and explicitly separates the
    guidance Hamiltonian (drives the dynamics) from the acceptance Hamiltonian (defines pi). This is the
    theoretical backbone of Robosample's accept/reject test and the license to use a cheaper or distorted
    guidance potential. Relevant to: HMC propagator, acceptance test, integrator reversibility/symplecticity.

- title: "Simple quantitative tests to validate sampling from thermodynamic ensembles"
  authors: ["Shirts, M. R."]
  year: 2012
  venue: "arXiv:1208.0910 (later J. Chem. Theory Comput. 2013, 9(2), 909-926)"
  doi: ""
  path: references/papers/1208.0910v1.md
  tags: [sampling, ensemble-validation, canonical, npt, testing, free-energy, statistical-tests]
  key_terms:
    - "ensemble consistency -- log-ratio of energy probabilities from two simulations at different beta must be linear in E"
    - "density of states cancellation -- taking the ratio P(E|beta2)/P(E|beta1) removes the unknown Omega(E)"
    - "maximum likelihood fit -- histogram-free estimator of the slope via a Fermi/logistic log-likelihood, most reliable method"
    - "optimal temperature gap -- separate beta1, beta2 by roughly the sum of the distribution standard deviations (Delta T / T = sqrt(2 kB / Cv))"
    - "necessary-not-sufficient test -- detects ensemble violations but does not certify ergodicity"
  key_equations:
    - "Canonical: P(x|beta) proportional to exp(-beta H(p,q))"
    - "P(E|beta) = Q(beta)^-1 Omega(E) exp(-beta E)"
    - "ln[P(E|beta2)/P(E|beta1)] = [beta2 A2 - beta1 A1] - (beta2 - beta1) E  (linear, slope = -(beta2-beta1))"
    - "NPT enthalpy: ln[P(H|beta2,P)/P(H|beta1,P)] = ln(beta1/beta2) + [beta2 G2 - beta1 G1] - (beta2-beta1) H"
    - "NPT volume: ln[P(V|beta,P2)/P(V|beta,P1)] = ln(P1/P2) + beta(G2-G1) - beta(P2-P1) V"
    - "Max-likelihood log L = sum_i ln f(-a0 - a1 E_i) + sum_j ln f(a0 + a1 E_j), f(x) = 1/(1+exp(-x))"
  invariants:
    - "A correctly sampled canonical ensemble must give a log probability-ratio slope of exactly -(beta2 - beta1)."
    - "Kinetic and potential energy independently obey the ensemble-validation relation when U is momentum-independent."
    - "The test is necessary but not sufficient: passing it does not prove ergodicity or full phase-space coverage."
  summary: >
    Provides a rigorous, system-agnostic test that a sampler reproduces the target Boltzmann distribution:
    run two simulations at slightly different beta (or P), and the log-ratio of their energy (or enthalpy/volume)
    histograms must be linear with slope fixed by the known beta gap, since the unknown density of states cancels.
    Linear, nonlinear, and especially histogram-free maximum-likelihood fits with analytic/bootstrap error bars
    detect sub-percent-of-kT errors. This is the practical gate for proving Robosample's HMC, Fixman, and
    constraint corrections actually sample pi(x) ~ exp(-beta U). Relevant to: ensemble-validation test gate,
    acceptance-correctness verification.

- title: "Implicit Ligand Theory: Rigorous Binding Free Energies and Thermodynamic Expectations from Molecular Docking"
  authors: ["Minh, D. D. L."]
  year: 2012
  venue: "arXiv:1208.4885 (later J. Chem. Phys. 137, 104106)"
  doi: ""
  path: references/papers/1208.4885v1.md
  tags: [free-energy, binding, docking, implicit-solvent, internal-coordinates, fep, bar, mbar, importance-sampling]
  key_terms:
    - "implicit ligand theory -- separates receptor sampling from ligand sampling so receptor configurations are sampled only once"
    - "binding PMF B(r_R) -- a rigid-receptor free energy of coupling the ligand, estimated per receptor snapshot"
    - "effective potential U(r_X) = U(r_X) + W(r_X) -- internal energy plus solvation potential of mean force"
    - "dominant state approximation -- estimate an exponential average by its single lowest-energy term"
    - "cumulant expansion -- series approximation of -beta^-1 ln <exp(-beta Psi)> in moments of Psi"
    - "internal vs external coordinates -- r_X are internal (BAT-like) coordinates; xi_L are the 6 rotation/translation DOF, with Jacobians for the Cartesian transform"
  key_equations:
    - "Standard binding free energy: dG0 = -beta^-1 ln( (Z_RL / (Z_R Z_L)) (C0 / 8 pi^2) )"
    - "Binding PMF: B(r_R) = -beta^-1 ln <exp(-beta Psi)>_{L,I} over ligand internal+external coords"
    - "dG0 = -beta^-1 ln <exp(-beta B)>_R + dG_xi,  dG_xi = -beta^-1 ln(Omega C0 / 8 pi^2)"
    - "FEP estimator: B_hat(r_R) = -beta^-1 ln (1/N) sum_n exp(-beta Psi(r_RL,n))"
    - "Importance sampling: <O>_T = <w O>_S / <w>_S, w(r) = q_T(r)/q_S(r)"
  invariants:
    - "Jacobians for the Cartesian-to-internal/external coordinate transformation must be carried (omitted in the paper only for brevity)."
    - "Convergence of the free-energy differences requires phase-space overlap between adjacent (alchemical) states."
    - "Reservoir/configuration swaps into the lambda=0 state must satisfy detailed balance."
    - "An exactly Boltzmann-preserving propagator (e.g. Hybrid Monte Carlo) avoids the finite-timestep energy spikes seen with plain MD."
  summary: >
    Derives a rigorous separation of receptor and ligand sampling for binding free energies: the binding PMF
    B(r_R) is a rigid-receptor coupling free energy (computable by FEP/TI/BAR/MBAR), and the standard binding
    free energy is an exponential average of exp(-beta B) over independently sampled receptor configurations
    plus a confinement term dG_xi. The formalism works in internal coordinates with separated external DOF and
    explicitly notes that an exactly Boltzmann-preserving propagator such as HMC removes finite-timestep
    artifacts. Relevant to: free-energy/binding estimators, internal-coordinate (BAT/Z-matrix) sampling,
    importance-sampling reweighting.

- title: "Toward canonical ensemble distribution from self-guided Langevin dynamics simulation"
  authors: ["Wu, X.", "Brooks, B. R."]
  year: 2011
  venue: "Journal of Chemical Physics 134, 134108"
  doi: "10.1063/1.3574397"
  path: references/papers/1.3574397.md
  tags: [enhanced-sampling, langevin-dynamics, sgld, reweighting, canonical-ensemble, constraints, shake]
  key_terms:
    - "self-guided Langevin dynamics (SGLD) -- adds a guiding force from local-average momentum to accelerate low-frequency motion"
    - "local/evolving average -- exponentially weighted running average separating low- and high-frequency properties (time scale t_L)"
    - "guiding factor lambda -- input strength of the guiding force; biases the conformational distribution"
    - "self-guiding temperature T_sg -- effective search temperature, T_sg = (T_lf/T_hf) T, a heuristic for choosing lambda"
    - "SGLD reweighting factor w_SGLD -- first-order-perturbation weight that converts the SGLD ensemble back to canonical"
    - "energy conservation factor xi -- cancels the net energy the guiding force injects"
  key_equations:
    - "SGLD equation of motion: p_dot_i = f_i + g_i - gamma_i p_i + R_i"
    - "Guiding force: g_i(t) = lambda_i gamma_i (p_tilde_i(t) - xi p_i(t))"
    - "Local average: p_tilde(t) = (1 - dt/t_L) p_tilde(t-dt) + (dt/t_L) p(t)"
    - "Reweight: <A> = <A w_SGLD>_SGLD / <w_SGLD>_SGLD"
    - "w_SGLD = exp( (lambda_lf chi_lf - 1)(E_p_tilde/kT) + (lambda_hf (T - chi_lf T_tilde)/(T - T_tilde) - 1)(E_p - E_p_tilde)/kT )"
  invariants:
    - "Constraint forces (SHAKE) must be included in the low-frequency force accumulation, computed as f_con = (2 m / dt^2)(r_con - r)."
    - "The guiding force biases the distribution; canonical averages are recovered only after reweighting by w_SGLD."
    - "Reweighting is a first-order perturbation and converges only for modest guiding factors / small distribution shifts."
  summary: >
    SGLD augments Langevin dynamics with a guiding force built from local-average momentum to boost slow,
    low-frequency motions and dramatically accelerate conformational search at little extra cost. The paper's
    contribution is a quantitative split of the partition function into low- and high-frequency parts, yielding
    a per-configuration reweighting factor w_SGLD that maps the biased self-guided ensemble back to the canonical
    distribution (valid to first order, for small bias). It also shows how to fold SHAKE constraint forces into
    the propagator. Relevant to: enhanced-sampling moves, Langevin propagator, reweighting back to pi(x), constraint handling.

- title: "Replica exchange and expanded ensemble simulations as Gibbs sampling: Simple improvements for enhanced mixing"
  authors: ["Chodera, J. D.", "Shirts, M. R."]
  year: 2011
  venue: "Journal of Chemical Physics 135, 194110"
  doi: "10.1063/1.3660669"
  path: references/papers/1.3660669.md
  tags: [replica-exchange, expanded-ensemble, gibbs-sampling, parallel-tempering, mcmc, detailed-balance, mixing, mbar]
  key_terms:
    - "Gibbs sampling view -- replica exchange and expanded ensembles are alternating conditional updates of (config x, state index k)"
    - "reduced potential u_k(x) -- u(x) = beta[H(x) + pV + sum_i mu_i n_i + ...], the state-defining energy"
    - "independence sampling -- draw the new state index directly from pi(k|x), always accept"
    - "Metropolized independence sampling -- always propose leaving the current state; provably mixes faster than plain independence sampling (Peskun)"
    - "restricted range sampling -- propose only among a neighborhood set S_i, cutting cost while preserving detailed balance"
    - "balance vs detailed balance -- deterministic update order satisfies only the weaker balance condition, still preserving pi(x,k)"
    - "mixing-time metrics -- second-eigenvalue relaxation time tau_2, state-index autocorrelation tau_ac, end-to-end transit tau_end"
  key_equations:
    - "Reduced potential: u(x) = beta[H(x) + pV(x) + sum_i mu_i n_i(x) + ...]"
    - "Boltzmann density: q_k(x) = exp(-u_k(x)), pi_k(x) = q_k(x)/Z_k"
    - "Expanded-ensemble joint: pi(x,k) proportional to exp(-u_k(x) + g_k), optimal g_k = -ln Z_k"
    - "State conditional: pi(k|x) = exp(g_k - u_k(x)) / sum_k' exp(g_k' - u_k'(x))"
    - "Replica-exchange swap accept: min(1, exp(-[u_i(x_j)+u_j(x_i)]) / exp(-[u_i(x_i)+u_j(x_j)]))"
  invariants:
    - "Any state-update scheme must sample the conditional pi(k|x) (or permutation pi(S|X)) to preserve the joint stationary distribution."
    - "Stochastic update choice obeys detailed balance; deterministic ordering obeys only balance -- both preserve pi(x,k), but history-dependent weights break it."
    - "Every thermodynamic state must assign finite nonzero density to any configuration (same parameters specified across states)."
    - "Empirical transition matrix is symmetrized so eigenvalues are real; mu_2 = 1 signals a decomposable (non-mixing) chain."
  summary: >
    Recasts replica exchange and expanded/simulated tempering as Gibbs sampling over the joint distribution
    pi(x,k) of configuration and thermodynamic-state index, which legitimizes cheap alternative state-swap
    moves -- independence sampling, Metropolized independence sampling, and restricted-range sampling -- that
    mix far faster than neighbor-only exchange at negligible cost while preserving the target distribution.
    It supplies concrete mixing-time diagnostics (tau_2, tau_ac, tau_end). For Robosample this underpins any
    multi-temperature / multi-Hamiltonian (lambda) generalized-ensemble layer on top of HMC. Relevant to:
    replica-exchange / expanded-ensemble driver, state-swap acceptance, mixing diagnostics.

- title: "Understanding the Hastings Algorithm"
  authors: ["Minh, David D. L.", "Minh, Do Le (Paul)"]
  year: 2015
  venue: "Communications in Statistics - Simulation and Computation (arXiv:1408.4438)"
  doi: ""
  path: references/papers/1408.4438v1.md
  tags: [mcmc, metropolis-hastings, acceptance-test, detailed-balance, proposal, sampling, theory]
  key_terms:
    - "Hastings algorithm (HA) -- general MCMC acceptance scheme built on a symmetric function s(x,y) satisfying the Hastings condition"
    - "Metropolis-Hastings (MH) -- the special case with maximal acceptance; min{1, (gamma(x|y)/p(x))(p(y)/gamma(y|x))}"
    - "Barker acceptance -- alpha = (1 + (p(x)/gamma(x|y))(gamma(y|x)/p(y)))^-1, always lower acceptance than MH"
    - "relative majorizing coefficient M(x,y) -- symmetric envelope >= H(x,y) reinterpreting HA as Markovian acceptance-rejection (MAR)"
    - "L(x,y), H(x,y) -- min and max of the two ratios p(x)/gamma(x|y) and p(y)/gamma(y|x), bracketing the free coefficient k(x,y)"
    - "un-normalized target p(.) -- normalization constant cancels in the acceptance ratio"
  key_equations:
    - "Hastings condition: 0 <= alpha_HA = s(x,y)(1 + (p(x)/gamma(x|y))(gamma(y|x)/p(y)))^-1 <= 1"
    - "MH acceptance: alpha_MH = min{1, (gamma(x|y) p(y)) / (p(x) gamma(y|x))}"
    - "Detailed balance: p(x) P(y|x) = p(y) P(x|y)"
    - "MAR acceptance: alpha = p(y) / (M(x,y) gamma(y|x)), with M(x,y) symmetric and >= H(x,y)"
  invariants:
    - "Transition kernel must satisfy detailed balance with respect to the un-normalized p(.) for pi to be invariant."
    - "The symmetric function s(x,y) (equivalently the majorizing coefficient M(x,y)) must be symmetric to preserve flow balance between x and y."
    - "MH maximizes acceptance among all Hastings algorithms (set C(x,y)=1); any larger envelope only rejects more proposals."
  summary: >
    Provides two intuitive, equivalent derivations (Algorithm M with a free symmetric coefficient k(x,y), and Markovian
    acceptance-rejection with a relative majorizing coefficient) that unify the Hastings, Metropolis-Hastings, Barker,
    and Stein acceptance rules and prove all satisfy detailed balance. It shows Metropolis-Hastings has the highest
    acceptance probability of any reversible scheme. This grounds the exact acceptance test used after every HMC proposal,
    including the general asymmetric-proposal form needed when guidance and acceptance potentials differ. Relevant to: the
    acceptance/Metropolis test in the HMC sampler.

- title: "Hamiltonian Monte Carlo Without Detailed Balance"
  authors: ["Sohl-Dickstein, Jascha", "Mudigonda, Mayur", "DeWeese, Michael R."]
  year: 2014
  venue: "Proceedings of the 31st International Conference on Machine Learning (ICML), JMLR W&CP 32 (arXiv:1409.5191)"
  doi: ""
  path: references/papers/1409.5191v5.md
  tags: [hmc, sampling, detailed-balance, momentum-flip, leapfrog, mixing, reversibility, volume-preservation]
  key_terms:
    - "LAHMC (Look Ahead HMC) -- on would-be rejection, apply leapfrog L additional times (up to K) instead of flipping momentum"
    - "fixed-point equation -- the weaker stationarity condition integral p(x) T(x'|x) dx = p(x'), which LAHMC satisfies without detailed balance"
    - "momentum flip operator F -- reverses v; its own inverse, energy- and volume-preserving"
    - "leapfrog operator L -- discrete reversible volume-preserving integrator; L^-1 = F L F"
    - "momentum randomization R(beta) -- partial Gaussian refresh v' = v sqrt(1-beta) + n sqrt(beta), persistent for beta<1"
    - "generalized detailed balance -- p(zeta) pi_La(zeta) = p(F L^a zeta) pi_La(F L^a zeta), a non-reversible balance that avoids random-walk mixing"
  key_equations:
    - "Joint density: p(x,v) ~ exp(-H), H(x,v) = E(x) + (1/2) v^T v"
    - "Standard HMC acceptance: pi_accept = min(1, p(zeta')/p(zeta)) with zeta' = F L zeta (proposal terms cancel)"
    - "LAHMC transition prob: pi_La(zeta) = min[ 1 - sum_{b<a} pi_Lb(zeta), (p(F L^a zeta)/p(zeta))(1 - sum_{b<a} pi_Lb(F L^a zeta)) ]"
    - "Remaining mass to flip: pi_F(zeta) = 1 - sum_a pi_La(zeta)"
  invariants:
    - "The leapfrog integrator must be exactly reversible (L^-1 = F L F) and volume-preserving (|det| = 1)."
    - "The momentum flip F must be an involution that leaves H invariant and preserves volume."
    - "Transition probabilities must satisfy the fixed-point (stationarity) equation; generalized detailed balance suffices and reversibility/detailed balance is not required."
  summary: >
    Recasts HMC operators (leapfrog L, flip F, randomization R) on a discrete state ladder and builds a sampler that, in
    situations that would normally reject, extends the trajectory with more leapfrog steps rather than flipping the
    momentum, satisfying the fixed-point equation via generalized detailed balance instead of detailed balance. This
    suppresses random-walk behavior and wasted gradient evaluations, more than doubling mixing speed. The reversibility
    and volume-preservation requirements it isolates are exactly the integrator invariants an internal-coordinate HMC must
    honor. Relevant to: HMC trajectory integration, momentum handling, and non-reversible enhanced-sampling moves.

- title: "Brownian dynamics study of a polymer chain of linked rigid bodies"
  authors: ["Pear, M. R.", "Weiner, J. H."]
  year: 1979
  venue: "The Journal of Chemical Physics, 71(1), 212"
  doi: "10.1063/1.438119"
  path: references/papers/1.438119.md
  tags: [constraints, fixman-potential, metric-determinant, internal-coordinates, jacobian, rigid-body, mass-metric, bat]
  key_terms:
    - "rigid model -- bond lengths and valence angles held as exact holonomic constraints; only dihedrals vary"
    - "flexible model -- same geometry maintained by stiff harmonic potentials; gives uniform dihedral distribution"
    - "metric determinant g(phi) -- determinant of the covariant mass-metric tensor G_ij on the constrained hypersurface"
    - "Fixman compensating potential -- U = kB T ln sqrt(g(phi)) added to the rigid model to recover the flexible (uniform) distribution"
    - "Fixman determinant theorem -- g computed from H_ij = sum_r (2/m_r)(dc_i/dx_r . dc_j/dx_r) over the constrained coordinates c_i"
    - "linked-rigid-body (Wittenburg) formulation -- tree-structured articulated dynamics in dihedral generalized coordinates"
  key_equations:
    - "Covariant mass metric: G_ij = (1/2) sum_r m_r (dx_r/dphi_i . dx_r/dphi_j), with g(phi) = det(G_ij)"
    - "Rigid configurational distribution: rho_R(phi) = C_R sqrt(g(phi))"
    - "Fixman potential: U(phi) = kB T ln sqrt(g(phi)) restores rho_RF(phi) = 1/2pi"
    - "Fixman determinant via constraints: H_ij = sum_r (2/m_r)(dc_i/dx_r . dc_j/dx_r), g related to det H"
    - "Gaussian momentum integral: integral d(phidot) exp(-beta G_ij phidot_i phidot_j) = pi^(n/2) / (beta^(n/2) sqrt(g))"
  invariants:
    - "A hard-constrained (rigid) internal-coordinate distribution carries a sqrt(det M(q)) = sqrt(g(phi)) metric factor that a stiff-spring (flexible) model does not."
    - "To make the constrained-coordinate sampler reproduce the unconstrained/flexible canonical distribution, add the Fixman potential kB T ln sqrt(g) (equivalently subtract (1/2) kB T ln det M from the effective energy)."
    - "The metric determinant of the free coordinates equals (up to mass factors) the determinant of the constraint-gradient matrix H_ij."
  summary: >
    Establishes that fixing bond lengths and valence angles as rigid constraints introduces a metric-determinant factor
    sqrt(g(phi)) into the configuration-space distribution that strong harmonic (flexible) models lack, and that adding
    the Fixman compensating potential kB T ln sqrt(g) exactly cancels it to recover the flexible/canonical distribution,
    confirmed by Brownian-dynamics simulation of a three-bond chain. It also gives Fixman's theorem for computing g from
    constraint gradients. This is the foundational justification for the Fixman/mass-metric correction in any
    internal-coordinate or constraint-based sampler. Relevant to: the Fixman term and the U_Jacobian mass-metric
    correction in BAT/Z-matrix sampling.

- title: "Replica exchanging self-guided Langevin dynamics for efficient and accurate conformational sampling"
  authors: ["Wu, Xiongwu", "Hodoscek, Milan", "Brooks, Bernard R."]
  year: 2012
  venue: "The Journal of Chemical Physics, 137(4), 044106"
  doi: "10.1063/1.4737094"
  path: references/papers/1.4737094.md
  tags: [enhanced-sampling, replica-exchange, langevin, reweighting, acceptance-test, basin-hopping, conformational-search]
  key_terms:
    - "SGLD -- self-guided Langevin dynamics; a low-frequency guiding force enhances slow collective modes without raising temperature"
    - "guiding force g_i = lambda_i gamma_i (ptilde_i - xi p_i) -- driven by local-averaged (low-frequency) momentum"
    - "energy-conservation factor xi -- chosen so the guiding force does no net work on the system"
    - "low/high-frequency local average -- Ptilde(t) = (1 - dt/tL) Ptilde(t-dt) + (dt/tL) P(t), an exponential filter"
    - "SGLD reweighting factor w_SGLD -- converts the biased SGLD ensemble back to the canonical ensemble"
    - "self-guiding temperature T_SG -- effective enhanced-sampling temperature without actually heating high-frequency modes"
  key_equations:
    - "Self-guided Langevin: pdot_i = f_i + g_i - gamma_i p_i + R_i, with <R_i(0)R_i(t)> = 2 m_i kT gamma_i delta(t)"
    - "SGLD partition function: Theta_SGLD ~ sum exp(-(lambda_lf chi_lf Eptilde)/kT - (lambda_hf chi_hf (Ep - Eptilde))/kT)"
    - "Reweight: <P>_LD = <P w_SGLD>_SGLD / <w_SGLD>_SGLD"
    - "Exchange acceptance: min{1, pi_RX} with pi_RX = exp(-(mutilde_m - mutilde_n) Delta Eptilde - (mu_m - mu_n) Delta Ep)"
    - "Momentum rescale on swap: s_mn = sqrt(T_n/T_m), separately for full and low-frequency momenta"
  invariants:
    - "The replica-exchange acceptance must use the SGLD partition function (both low- and high-frequency energy terms), not the bare Boltzmann ratio, or the base stage will not sample the canonical ensemble."
    - "The guiding force must inject zero net energy (enforced by xi) so it redistributes energy across modes rather than heating the system."
    - "On an accepted swap, momenta must be rescaled by sqrt(T_n/T_m) to remain consistent with each stage's temperature."
    - "Base stage (no guiding) must reproduce pi(x) ~ exp(-beta U); guided stages are sampled only to accelerate barrier crossing."
  summary: >
    Introduces a replica-exchange scheme whose stages differ in a low-frequency guiding force (self-guiding temperature)
    rather than in real temperature, with the exchange acceptance derived from the SGLD partition function so the base
    stage still yields the exact canonical distribution while slow conformational modes cross barriers faster. Because
    only low-frequency motion is perturbed, exchange probabilities stay high and the method is size-extensive. The
    pattern -- a biased guidance dynamics plus an exact reweighting/acceptance that restores the target -- mirrors the
    HMC guidance-vs-acceptance separation. Relevant to: enhanced-sampling and replica-exchange moves layered on the HMC
    sampler.

- title: "Maintain rigid structures in Verlet based Cartesian molecular dynamics simulations"
  authors: ["Tao, Peng", "Wu, Xiongwu", "Brooks, Bernard R."]
  year: 2012
  venue: "The Journal of Chemical Physics, 137(13), 134110"
  doi: "10.1063/1.4756796"
  path: references/papers/1.4756796.md
  tags: [constraints, rigid-body, shake, rattle, integrator, angular-momentum, verlet, symplectic]
  key_terms:
    - "SHAPE -- rigid-body constraint method that corrects coordinates by a rotation each step instead of solving Lagrange multipliers"
    - "Lagrange-multiplier avoidance -- cost independent of particle count M (vs 3M-6 multiplier equations in SHAKE for large bodies)"
    - "body-fixed COM frame -- separates rigid motion into COM translation (linear momentum) and rotation about COM (angular momentum)"
    - "Rodrigues rotation / matrix exponential -- R = exp(theta_hat) builds the per-step rotation from angular velocity"
    - "SHAKE/RATTLE -- standard holonomic constraint integrators that SHAPE is interchangeable with"
    - "shared-atom cyclic iteration -- bodies sharing an atom (e.g. C-alpha between peptide planes) converged by cyclic application like multiple SHAKE constraints"
  key_equations:
    - "Angular-momentum match: L^rig(t+dt/2) = L^non(t+dt/2), the equation SHAPE solves iteratively"
    - "omega from inertia: omega^rig = I^-1 sum_i r_i^b x (m_i (r_i^non(t+dt) - r_i^b(t))/dt)"
    - "Rotation update: r_i^rig,b(t+dt) = R r_i^b(t), R = exp(theta_hat), theta = ||omega|| dt"
    - "Half-step root approximation: (R^(n))^(1/2) ~ (1/2)(1 + R^(n))"
    - "Local error O(dt^3) per step, global error O(dt^2)"
  invariants:
    - "Linear and angular momentum must be conserved by the constraint correction (linear via the body-fixed COM frame, angular via the iterated L match)."
    - "The method is holonomic and symplectic, interchangeable with SHAKE, and conserves total energy with minimal drift over long runs."
    - "Rigid structures sharing an atom require cyclic iteration to mutual convergence, exactly as overlapping SHAKE constraints do."
    - "Use the Taylor-expanded rotation matrix when ||theta|| is small to avoid the 1/||theta|| numerical instability in Rodrigues' formula."
  summary: >
    Presents SHAPE, a Verlet-compatible rigid-body integrator that, after each unconstrained step, rotates the body's
    atoms about their center of mass to restore rigidity while matching the unconstrained angular momentum, conserving
    linear and angular momentum and total energy without computing Lagrange multipliers. It is fully interchangeable with
    SHAKE/RATTLE, scales independently of body size, handles linear/planar/large bodies and atoms shared between bodies,
    and is third-order accurate per step (O(dt^2) global). This is directly applicable to imposing rigid groups and
    SHAKE/RATTLE-style holonomic constraints inside a constraint-based sampler. Relevant to: the constraint/RATTLE-SHAKE
    layer and rigid-body definition in the multibody engine.

- title: "A simple molecular mechanics integrator in mixed rigid body and dihedral angle space"
  authors: ["Vitalis, A.", "Pappu, R. V."]
  year: 2014
  venue: "Journal of Chemical Physics, 141, 034105"
  doi: "10.1063/1.4887339"
  path: references/papers/1.4887339.md
  tags: [internal-coordinates, torsional-dynamics, rigid-body, mass-metric-tensor, fixman, integrator, sampling, z-matrix]
  key_terms:
    - "Mass-metric tensor (MMT) G = J^T M J -- metric of generalized coordinates whose determinant biases configurational statistics"
    - "MMT artifact -- phi-dependence of det(G_S) introduced when a subset of coordinates is constrained, distorting the equilibrium distribution"
    - "Mixed rigid-body/dihedral coordinates -- Z-matrix torsions plus Cartesian coordinates of the first three atoms per molecule (the base)"
    - "Diagonal effective-mass approximation -- stipulated diagonal I_D (translational mass, rotational inertia, per-dihedral inertia I_phi) replacing the true coupled mass matrix"
    - "Bias torques -- terms from dJ/dt that appear when propagating generalized momenta; lumped here into time-dependence of effective masses"
    - "Base of motion -- the reference rigid body (terminus or chain middle) carrying the external degrees of freedom"
  key_equations:
    - "Cartesian Hamilton eqns: p_dot = -grad U(r), r_dot = M^-1 p"
    - "Generalized kinetic energy: E_k = (1/2) p_phi^T (J^T M J)^-1 p_phi, with G = J^T M J the mass-metric tensor"
    - "Partition function after momentum integration: Q = integral sqrt(det G) exp(-beta U(phi)) dphi"
    - "Diagonal-mass approximate KE: E'_k = (1/2) sum_k I_kk omega_k^2 (not equal to (1/2) p^T M^-1 p)"
    - "Per-DOF energy-conserving update (leap-frog-like): omega_k(t2) from quadratic in I_kk(t1), I_kk(t2), F_phi,k"
    - "Underlying EOM in Omega_k = I_kk^1/2 omega_k: I_kk^1/2 Omega_dot_k = -dU/dphi_k, I_kk^1/2 phi_dot_k = Omega_k"
    - "Resulting partition function: Q_S = C(T) integral exp(-beta U(phi)) dphi -- no det(G) weighting, hence flat free-DOF distributions"
  invariants:
    - "Coordinate map must be a reversible bijection phi = A(r), r = A^-1(phi) with tree-like (Z-matrix) build order."
    - "Auxiliary computations (effective masses I_kk, generalized forces F_phi) must scale O(N_at) via recursion."
    - "The I_kk^1/2 factors are exactly what preserve volume in phi-space; by construction det(G_S) never enters, so MMT artifacts are absent in the zero-potential limit (flat dihedral distributions)."
    - "Per-DOF equipartition: <omega_k^2 I_kk> = 1/beta (k_B T)."
    - "Linear momentum is conserved under the diagonal-mass approximation in the absence of external forces."
  summary: >
    Proposes a torsional/rigid-body integrator that deliberately replaces the true coupled
    mass-metric tensor with a diagonal effective-mass matrix and enforces per-degree-of-freedom
    energy conservation, so the proposal samples exp(-beta U(phi)) with no det(M(q)) Jacobian
    weighting and no Fixman correction -- it sidesteps mass-metric-tensor artifacts by construction
    rather than compensating for them, at the cost of physical dynamics. Validated as thermodynamically
    (not kinetically) correct against MC and constrained-Cartesian references. Directly relevant to
    how Robosample treats the mass metric M(q), the Fixman/U_Jacobian term, and whether a constrained
    internal-coordinate proposal needs a determinant correction.
    Relevant to: internal-coordinate proposal / mass-metric and Fixman subsystem.

- title: "Overcoming potential energy distortions in constrained internal coordinate molecular dynamics simulations"
  authors: ["Kandel, S.", "Salomon-Ferrer, R.", "Larsen, A. B.", "Jain, A.", "Vaidehi, N."]
  year: 2016
  venue: "Journal of Chemical Physics, 144, 044112"
  doi: "10.1063/1.4939532"
  path: references/papers/1.4939532.md
  tags: [fixman, internal-coordinates, ICMD, torsional-dynamics, BAT, mass-matrix, constraints, spatial-operator, GNEIMO, hybrid-ICMD]
  key_terms:
    - "Intrinsic distortion -- mass-matrix-determinant bias from the reduced phase space of constrained torsional dynamics; force-field independent"
    - "Extrinsic distortion -- bias from force-field coupling between frozen bond angles and free torsions; NOT removed by the Fixman potential"
    - "Fixman potential U_f -- (1/2) kT ln( det M(alpha,q0) / det M_B(alpha,q0) ), compensates intrinsic distortion"
    - "BAT coordinates -- bond/angle/torsion internal coordinates; 3n total partitioned into N free (alpha) and 3n-N constrained (q)"
    - "Hybrid ICMD -- selectively unfreezing key backbone bond angles (e.g. C-N-Calpha and N-Calpha-C) to remove extrinsic distortion"
    - "GNEIMO -- Generalized Newton-Euler Inverse Mass Operator spatial-operator-algebra engine giving O(n) recursive M^-1 and Fixman torque"
    - "Hellinger distance -- metric used to quantify difference between constrained and flexible (phi,psi) probability densities"
  key_equations:
    - "Unconstrained config pdf: rho_u(alpha,q) proportional to det(M_B^(1/2)(alpha,q)) exp(-U(alpha,q)/kT)"
    - "Full mass-matrix determinant factorizes: det(M_B) = sin^2(gamma2) d2^4 prod_{i=3}^n d_i^4 sin^2(theta_i) prod m_i^3 = f1(alpha) f2(q); independent of torsions"
    - "Constrained pdf: rho_c(alpha,q0) proportional to det(M^(1/2)(alpha,q0)) exp(-U(alpha,q0)/kT), where det(M) does NOT factorize"
    - "Fixman potential: U_f(alpha) = (1/2) kT ln[ det M(alpha,q0) / det M_B(alpha,q0) ]"
    - "Compensated pdf: rho_f(alpha,q0) proportional to det(M_B^(1/2)) exp(-U/kT); for pure TMD reduces to rho_f proportional to exp(-U(alpha,q0)/kT)"
    - "Constrained transition-state barrier-crossing rate retains S^-1(alpha0) = [M^-1(alpha0)]_alpha even after Fixman correction"
  invariants:
    - "Fixman potential exactly restores the unconstrained CONFIGURATIONAL pdf only when U=0, when alpha and q are separable, or when the constrained DOFs sit in a very steep well around q0."
    - "Fixman correction removes intrinsic (mass-matrix) bias but only PARTIALLY corrects velocity-dependent quantities (barrier-crossing rates) and does NOT remove extrinsic force-field coupling."
    - "det(M_B) is torsion-independent and separable per individual bond length/angle; det(M) of the constrained model is not separable."
    - "For realistic AMBER-scale angle stiffness (k_theta ~ 30-100 kcal), torsion/angle coupling is non-negligible, so Fixman alone is insufficient -- key bond angles must be opened."
  summary: >
    Decomposes the statistical bias of constrained internal-coordinate MD into a mass-matrix
    intrinsic distortion (curable by the Fixman det-ratio potential) and a force-field extrinsic
    distortion (not curable by Fixman), and shows via C4 chains and dipeptides that the Fixman
    potential exactly fixes torsional pdfs but only partially fixes velocity-dependent barrier
    rates; opening a few key backbone angles (hybrid ICMD) is needed to recover the all-atom
    free-energy surface. This is the canonical justification and exact form of the Fixman/U_Jacobian
    term and clarifies when a BAT/Z-matrix constrained proposal is and is not corrected by it.
    Relevant to: Fixman correction, U_Jacobian, constrained BAT/Z-matrix proposals and acceptance.

- title: "Identifying the Optimal Integration Time in Hamiltonian Monte Carlo"
  authors: ["Betancourt, M."]
  year: 2016
  venue: "arXiv preprint arXiv:1507.03703"
  doi: ""
  path: references/papers/1507.03703v2.md
  tags: [hmc, sampling, integration-time, NUTS, symplectic-integrator, detailed-balance, microcanonical, exhaustion, trajectory]
  key_terms:
    - "Microcanonical disintegration -- foliation of the cotangent bundle into constant-energy level sets; canonical measure splits into uniform microcanonical distributions plus a marginal energy distribution"
    - "Integration time T(z) -- the tunable trajectory length; too short gives diffusive (Langevin) exploration, too long wastes computation"
    - "Modified (shadow) Hamiltonian H-tilde -- the Hamiltonian a symplectic integrator exactly conserves; H-tilde = H + epsilon^k G + O(epsilon^(k+2))"
    - "Exhaustion -- family of integration times bounding the temporal average of the virial rate dG/dt below threshold delta"
    - "Virial G = q^i p_i -- the only scalar canonical to a generic Hamiltonian system usable to build a termination criterion"
    - "No-U-Turn (NUTS) criterion -- terminates when g_q^-1(p, rho_T) < 0; Euclidean case is standard NUTS"
    - "Multiplicative (binary-tree) trajectory expansion -- doubles trajectory length, needs only log(L) termination checks and log(L) states in memory"
  key_equations:
    - "Lifted target is canonical on cotangent bundle: pi_H = exp(-H) Omega, H = K + V"
    - "Single-state Metropolis acceptance with involution R: a = min(1, exp(H(R(z_L)) - H(z_0)))"
    - "Trajectory-sampling weights for detailed balance: P[z|t] = exp(-H(z)) / sum_{z' in t} exp(-H(z'))"
    - "Detailed-balance sufficiency condition: P[t|z1] = P[t|z2] for all t containing both z1 and z2 (uniform trajectory sampling gives P[t|z]=1/L)"
    - "Exhaustion criterion: | (G(phi_T(z)) - G(z)) / T_delta | < delta for all z"
    - "Birkhoff ergodic average: lim_{T->inf} (1/T) integral_0^T f(phi_t(z)) dt = E_microcanonical[f]"
  invariants:
    - "A raw forward-integrated symplectic trajectory is NOT a valid Metropolis proposal; it must be made an involution (compose with momentum-flip R) so that R after flow after R = Identity."
    - "Sampling a state from a multi-state trajectory preserves pi only if states are weighted by exp(-H(z)) AND trajectory selection satisfies P[t|z1]=P[t|z2] (else detailed balance breaks)."
    - "Symplectic integrators preserve the symplectic volume form exactly; volume preservation keeps numerical trajectories oscillating near the true flow without long-term drift."
    - "Dynamic-length trajectories require checking the termination criterion on all internal subtrees and rejecting expansions reachable-from-only-some states, to keep detailed balance."
  summary: >
    A geometric treatment of HMC showing that the canonical (Boltzmann) distribution is the
    invariant measure of the symplectic Hamiltonian flow and that performance hinges on the
    integration time, which is optimally set by an autocorrelation/termination criterion
    (exhaustion via the virial, or the No-U-Turn criterion) rather than a fixed length. It
    spells out exactly how to keep detailed balance when accepting a state sampled from a
    forward/backward trajectory: involution-corrected acceptance min(1, exp(-Delta H)) and
    exp(-H)-weighted state selection. Directly informs how Robosample sets HMC trajectory
    length, the velocity-flip reversibility requirement, and the exact dH acceptance test.
    Relevant to: HMC proposal, trajectory-length tuning, reversibility/acceptance test.

