    Cartesian gradients into internal accelerations via small 6x6 spatial matrices and
    D'Alembert's principle. Reducing to dihedral DOF and eliminating stiff bond/angle
    vibrations permits stable dynamics at 5000-10000 K, dramatically enlarging the radius
    of convergence for crystallographic refinement. This is the algorithmic ancestor of
    internal-coordinate/rigid-body propagation: spatial-vector velocities (angular over
    linear), tree topology, inboard/outboard aggregation, and the M^-1*Q articulated
    solve. Relevant to: the O(n) multibody propagator and torsion-space proposal moves.

