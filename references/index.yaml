    - "hard vs soft variables -- hard = bond lengths and bond angles (high-frequency); soft = dihedral angles plus external (rigid-body) DOF"
    - "G matrix -- the m-by-m mass-metric (kinetic-energy) matrix in dihedral coordinates, G = (H0)^-1, the Schur complement of the full mass matrix"
    - "det G -- conformation-dependent determinant of the dihedral mass-metric; the metric correction term that distinguishes the two models"
