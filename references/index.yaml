  key_terms:
    - "CDHMC -- Constrained Dynamics Hamiltonian Monte Carlo used as a Gibbs-sampling move over a subset of coordinates"
    - "World -- a defined set of rigid bodies and joints (one Simbody multibody chain) mapped onto the same Molmodel chemical graph"
    - "Gibbs sampling -- alternate blocks of flexible coordinates (worlds) so every DOF is modifiable by at least one move, restoring ergodicity"
    - "Fixman potential -- correcting potential added so constrained marginal density matches the fully flexible one"
    - "Fixman torque -- derivative of the Fixman potential, applied during MD so trajectories sample the Boltzmann distribution"
    - "Mass matrix tensor M_tot = J^T M J -- generalized-coordinate inertia built from Cartesian mass matrix M and Jacobian J = dx/dphi"
    - "Spatial Operator Algebra (SOA) -- O(N) recursive multibody formulation giving det, gradient, log, sqrt of the mass-matrix tensor"
    - "Spherical/cylindrical joints -- Ball (3 rotational DOF, Euler/quaternion) and Cylinder (translation+rotation) mobilizers capturing torsion-bond/torsion-angle coupling"
    - "Ramachandran dynamics -- only phi and psi torsions mobile; accelerates the slowest transition by an order of magnitude"
  key_equations:
    - "Hamiltonian (reduced coords): H = p_f^T M(phi_f) p_f + U(phi_f)"
    - "Flexible marginal config density: rho(phi_f,phi_v) proportional to |M_tot(phi)|^(-1/2) exp(-beta U)"
    - "Reduced marginal config density: rho(phi_f) proportional to |M(phi_f)|^(-1/2) exp(-beta U)"
    - "Fixman potential: U'(phi_f) = kT ln( |M_tot(phi)| / |M(phi_f)| )^(1/2)"
    - "Corrected reduced Hamiltonian: H = p_f^T M(phi_f) p_f + U(phi_f) + U'(phi_f)"
    - "Optimal HMC acceptance rate ~ 0.651"
  invariants:
    - "Each Gibbs move draws from the conditional Boltzmann distribution; velocities initialized per a generalized-coordinate equipartition theorem."
    - "Every DOF must be modifiable by at least one move (include a fully flexible world per cycle) to ensure ergodicity."
    - "Final configuration of each deterministic MD trajectory accepted/rejected by Metropolis-Hastings."
    - "M, M^-1, det M, sqrt M obtained via O(N) SOA recursions, never by assembling/inverting the dense tensor."
  summary: >
    Describes the Robosample program itself: a multibody, constraint-based Hamiltonian Monte Carlo
    sampler that mixes fully flexible and constrained (torsional, cylindrical, spherical) dynamics as
    Gibbs moves across "worlds," using the Fixman potential/torque and O(N) spatial operator algebra so
    constrained MD samples the correct conditional Boltzmann distribution. It validates free-energy-surface
    recovery on alanine dipeptide and enhanced conformational coverage on a glycan, and gives the parameter-
    tuning workflow (integration time, time step, ~0.651 acceptance). This is the canonical reference for the
    code's statistical-mechanics foundation. Relevant to: the whole sampler -- World/Gibbs scheme, Fixman correction, mass-metric operators, acceptance test.

- title: "ICFF: A New Method to Incorporate Implicit Flexibility into an Internal Coordinate Force Field"
  authors: ["Katritch, V.", "Totrov, M.", "Abagyan, R."]
  year: 2003
  venue: "Journal of Computational Chemistry, 24(2):254-265"
  doi: "10.1002/jcc.10091"
  path: references/papers/jcc.10091.md
  tags: [internal-coordinates, force-field, torsion-space, rigid-geometry, projection, fixed-bond-geometry, mmff94]
  key_terms:
    - "ICFF -- internal-coordinate force field that projects a Cartesian force field onto a fixed-bond-geometry torsion model"
    - "Implicit flexibility -- bond stretch/bend, out-of-plane, and 1-4 vdW effects absorbed into torsion parameters so the rigid model mimics the flexible one"
    - "Torsion fragment -- the two bonded atoms plus immediate neighbors, reoptimized at each torsion value to build a torsion energy profile"
    - "1-5,1-6 soft repulsion -- empirical polynomial term replacing hard vdW between atoms 4-5 bonds apart to mimic bond flexibility"
    - "Local-energy covalent geometry -- fixed bond lengths/angles set by Cartesian minimization using only bonded + 1-4 terms"
  key_equations:
    - "Torsion term (sixfold Fourier series): E_tor = C_0 + sum_{k=0..6} (A_k cos(k*theta) + B_k sin(k*theta))"
    - "Soft 1-5/1-6 repulsion: E = eps_IJ [ C ((R-R*)/(R0-R*))^2 - 1 ) + (1-C)(((R-R*)/(R0-R*))^3 - 1) ] for R < R*, with C ~ 0.55"
    - "Constraint potential for fixed torsion in profiling: E_r = C_r (theta - theta0)^2, C_r = 10000 kcal"
  invariants:
    - "Soft 1-5,1-6 term equals eps_IJ with zero derivative at R=R* and crosses zero at R=R0, joining continuously with the unchanged attractive vdW branch."
    - "Torsion parameters are independent of the initial covalent geometry because the fragment is reoptimized at each torsion value."
    - "1-4 vdW folded into the torsion term; interactions 6+ bonds apart keep the original hard vdW."
  summary: >
    Introduces the projection method that turns a flexible Cartesian force field into a fixed-geometry
    internal-coordinate (torsion-only) force field, absorbing bond/angle/1-4 flexibility into a sixfold
    Fourier torsion term and softening 1-5/1-6 clashes, cutting free variables ~10-fold while keeping
    sub-kcal accuracy. It matters because constrained/torsional sampling on a Cartesian force field
    distorts the potential surface, and this is the foundational fix later extended for protein dynamics.
    Relevant to: the guidance potential used in constrained (torsional/rigid) worlds when bonds and angles are frozen.

