    - "HMC trial moves are velocity-Verlet trajectories accepted by the Metropolis criterion, preserving the Boltzmann distribution."
    - "Replica-exchange swap acceptance preserves the Boltzmann distribution in both states (it is a Gibbs/MCMC move)."
    - "Final BPMF must be independent of the (Desolvated vs Full) alchemical pathway in the limit of asymptotic sampling; pathway disagreement diagnoses false convergence."
    - "Free-energy precision requires configuration-space overlap between adjacent thermodynamic states (roughly equal thermodynamic length)."
  summary: >
