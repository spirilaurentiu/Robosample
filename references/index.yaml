- title: "Internal Coordinate Molecular Dynamics: A Foundation for Multiscale Dynamics"
  authors: ["Vaidehi, N.", "Jain, A."]
  year: 2015
  venue: "Journal of Physical Chemistry B, 119, 1233-1242 (Feature Article)"
  doi: "10.1021/jp509136y"
