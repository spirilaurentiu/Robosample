  tags: [internal-coordinate, icmd, bat, mass-metric, velocity-initialization, fixman, spatial-operators, equipartition, sampling]
  key_terms:
    - "ICMD mass matrix M(theta) -- configuration-dependent, dense, symmetric positive-definite generalized-coordinate inertia, M = J^T M_cart J"
    - "BAT coordinates -- bond/angle/torsion internal coordinates; for full BAT N = 3n and Jacobian J is square/invertible"
    - "TAMD -- torsion-angle MD; BAT with holonomic constraints freezing bonds/angles so N < 3n and J is non-square"
    - "Modal coordinates nu -- noncanonical velocity coordinates nu = m^T(theta) thetadot that diagonalize the kinetic energy"
    - "Fixman/U_Jacobian term -- U_c(theta) = (1/2) ln det M(theta) appearing when changing integration variable from p to nu"
    - "Spatial-operator factorization -- M = [I + H phi K] D [I + H phi K]^T giving O(N) recursive transforms without assembling M"
    - "non-separable Hamiltonian -- ICMD kinetic energy depends on both p and theta, unlike Cartesian"
  key_equations:
    - "ICMD Hamiltonian: H(theta,p) = (1/2) p^T M^-1(theta) p + U(theta)"
    - "Generalized equipartition: <y_i dH/dy_j> = kT delta_ij (only for canonical coordinates)"
    - "Mass factorization: M(theta) = m(theta) m^T(theta); modal coords nu = m^T thetadot = l(theta) p"
    - "Decoupled Hamiltonian: H(theta,nu) = (1/2) nu^T nu + U(theta)"
    - "Volume / Jacobian change: dp_1...dp_N = det{M(theta)}^(1/2) dnu_1...dnu_N"
    - "Effective potential with Fixman-type term: U'(theta) = U(theta) + (1/2) ln det M(theta)"
    - "Modal equipartition: <nu_i nu_j> = kT delta_ij, i.e. <nu nu^T> = kT I_N"
    - "Constrained velocity map: thetadot = P xdot with P = M^-1 H phi M_cart^(1/2) so m^T P P^T m = I"
  invariants:
    - "Canonical (theta,p) ICMD coordinates do NOT satisfy a Cartesian-like kinetic equipartition; only noncanonical modal nu do."
    - "Initializing velocities by drawing nu ~ Boltzmann (mean kT/2 each) then mapping nu -> thetadot is the thermodynamically rigorous way; ad hoc projection of Cartesian velocities is wrong for constrained models."
    - "The det M(theta) factor (Fixman term) must accompany the configurational measure when transforming momentum integrals to modal coordinates."
    - "M, M^-1, sqrt(M), det M are applied as O(N) articulated-body operators, never assembled."
  summary: >
    Derives that the standard kinetic-energy equipartition kT/2 per coordinate fails for internal-coordinate
    (BAT/TAMD) models because the mass matrix M(theta) is configuration-dependent and couples coordinates, making
    the Hamiltonian non-separable. By introducing noncanonical modal velocities nu = m^T(theta) thetadot from a
    factorization M = m m^T, it recovers <nu nu^T> = kT I, giving a rigorous Boltzmann velocity-initialization
    recipe and exposing the (1/2) ln det M(theta) Fixman/Jacobian term. Spatial-operator algebra yields O(N)
    recursive transforms between physical and modal velocities without ever forming M or its inverse.
    Relevant to: velocity initialization, the mass-metric M(q) and Fixman/U_Jacobian correction, and the O(n)
    articulated-body operators of the multibody engine.

- title: "Equation of State Calculations by Fast Computing Machines"
  authors: ["Metropolis, N.", "Rosenbluth, A. W.", "Rosenbluth, M. N.", "Teller, A. H.", "Teller, E."]
  year: 1953
  venue: "Journal of Chemical Physics, 21, 1087-1092"
  doi: "10.1063/1.1699114"
  path: references/papers/EquationOfState.md
  tags: [monte-carlo, metropolis, detailed-balance, acceptance-test, canonical-ensemble, sampling, importance-sampling]
  key_terms:
    - "Metropolis Monte Carlo -- importance sampling that draws configurations with probability proportional to exp(-E/kT) and weights them evenly"
    - "Acceptance rule -- accept if Delta E < 0, else accept with probability exp(-Delta E / kT)"
    - "Symmetric proposal -- a priori move probabilities satisfy P_rs = P_sr (uniform displacement in a box of side 2 alpha)"
    - "Ergodicity -- a large enough number of moves reaches any point in configuration space"
    - "Rejected-move counting -- a forbidden move re-counts the original configuration in the average"
    - "Maximum displacement alpha -- tuning knob trading move size against acceptance fraction"
  key_equations:
    - "Canonical average: F_bar = integral F exp(-E/kT) d^2N p d^2N q / integral exp(-E/kT) d^2N p d^2N q"
    - "Energy: E = (1/2) sum_i sum_{j != i} V(d_ij)"
    - "Proposal: X -> X + alpha xi_1, Y -> Y + alpha xi_2 with xi in (-1,1)"
    - "Acceptance: accept Delta E < 0 always; else accept if xi_3 < exp(-Delta E / kT)"
    - "Estimator: F_bar = (1/M) sum_{j=1}^M F_j over all (accepted or rejected) configurations"
    - "Stationary target: nu_r proportional to exp(-E_r / kT)"
  invariants:
    - "Proposal must be symmetric (P_rs = P_sr) for the bare exp(-Delta E/kT) acceptance to give the canonical distribution."
    - "After a rejected move the original configuration is counted again in the average; omitting it biases populations."
    - "The chain must be ergodic so any state is reachable from any other."
    - "Momentum integrals factor out for velocity-independent potentials; only configuration space need be sampled."
  summary: >
    The foundational paper introducing the Metropolis Monte Carlo algorithm: sample configuration space so that
    states appear with their Boltzmann weight by proposing a symmetric random move and accepting it with
    probability min(1, exp(-Delta E/kT)). It proves the scheme is ergodic and drives the ensemble to the
    canonical distribution nu_r ~ exp(-E_r/kT), and notes rejected moves must still be counted. This is the
    detailed-balance acceptance test at the heart of any HMC/MCMC sampler.
    Relevant to: the Metropolis acceptance criterion and detailed-balance correctness of the HMC move proposal/acceptance step.

