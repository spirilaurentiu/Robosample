- key: forrest_1994_gchmc
  doc_type: methods
  title: Generalized coordinate hybrid Monte Carlo
  authors:
  - Forrest
  - Suter
  year: '1994'
  venue: Molecular Physics
  doi: 10.1080/00268979400100304
  summary: 'Hybrid Monte Carlo in internal (torsional) generalized coordinates for dense polymer melts
    with fixed bond lengths/angles. Introduces fictitious Cartesian-like angular momenta with constant
    effective moments of inertia to make the equations of motion decoupled and leap-frog-integrable, avoiding
    the coupled inertia-tensor dynamics and matrix inversion of true internal-coordinate MD. Acceptance
    includes an Euler-angle Jacobian (product of sin phi2). Choosing effective moments of inertia equal
    to the equilibrium mean instantaneous moment of inertia recovers a unique real-time scale and speeds
    equilibration.

    '
  has_implementable_math: true
  methods:
  - hybrid Monte Carlo (HMC)
  - internal-coordinate / torsional generalized-coordinate sampling
  - fictitious diagonal kinetic energy with effective moments of inertia
  - leap-frog integration
  - Maxwell-Boltzmann momentum refresh
  - Metropolis acceptance with coordinate-transform Jacobian
  - Ryckaert-Bellemans torsional potential
