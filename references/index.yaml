    - "Velocities assigned as zero-mean unit-variance normals in modal coords, recovered to theta_dot via O(N) base-to-tips recursion, then CM velocity reset and rescaled to target T."
    - "CM linear and angular momentum must be periodically nulled or the flying ice cube effect freezes internal motion at large time steps."
    - "Fixman correction potential is required to remove the systematic thermodynamic bias from holonomic constraints (noted as future numerical work)."
  summary: >
    Addresses the practical correctness issues unique to constrained internal-coordinate MD in the GNEIMO/SOA
    framework: a rigorous modal-coordinate velocity initialization that satisfies a CICMD equipartition
    principle, an O(N) composite-inertia method to null center-of-mass momentum, identification and cure of a
    Nose-Hoover flying-ice-cube effect, suitable integrators (RK4, Lobatto, CVODE) for the nonseparable
    Hamiltonian, and adaptive freeze/thaw coarse graining. It explicitly flags the Fixman compensating potential
    as needed to remove constraint bias. Relevant to: generalized-coordinate velocity initialization (equipartition), momentum nulling, thermostat/integrator choice, and the Fixman correction.

