    modal velocity coordinates v = m*(theta) thetadot that decouple the configuration-dependent ICMD kinetic
    energy (M = m m*). In modal coordinates <v_i v_j> = kT delta_ij (each modal DOF carries kT/2), unlike
    the dense-coupled physical (theta, p) coordinates. Gives spatial-operator factorizations of the mass
    matrix and its inverse (M = [I+HphiK] D [I+HphiK]*) and O(N) recursive base-to-tip algorithms (Table
    1) to transform between modal and physical velocities without forming M, m, or l. Provides a thermodynamically
    rigorous method for initializing ICMD velocities (constrained and unconstrained), replacing ad hoc
    projection, and a basis for internal-coordinate conformational entropy.

    '
