  summary: 'Brownian (Langevin) dynamics of a macromolecule backbone modeled as linked rigid bodies via
    the Wittenburg formalism, satisfying bond-length and valence-angle constraints exactly. Derives the
    articulated generalized mass matrix A and force vector B (A*phidotdot=B) with per-atom Langevin/damping
    forces reduced to per-body spatial moments. Shows the rigid-model dihedral distribution carries a
    metric determinant sqrt(g) absent from the flexible model, and that a Fixman compensating potential
    U=kT*ln(sqrt(g)) restores the flexible (uniform) distribution. Gives exact transition-state barrier-crossing
    rate formulas (with and without stress) for the three-bond 90-degree chain.

