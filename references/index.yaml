    - "J(xi) is the Jacobian for transforming Cartesian into the external (translation/rotation) coordinate system"
    - "Replica-exchange acceptance: p_acc = min(1, exp(-u_a(y) - u_b(x) + u_a(x) + u_b(y)))"
    - "Alchemical switching: u_alpha(r_RL) = (1/k_B T(alpha))[U_s(r_L)+U_s(r_R)+alpha_sg Psi_sg + alpha_g Psi_g]"
    - "Thermodynamic length: L = integral_0^1 sqrt( sum_ij (dgamma^i/dalpha) g_ij (dgamma^j/dalpha) ) dalpha, g_ij from Fisher information"
