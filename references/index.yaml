- title: "Self-Guided Langevin Dynamics via Generalized Langevin Equation"
  authors: ["Wu, Xiongwu", "Brooks, Bernard R.", "Vanden-Eijnden, Eric"]
  year: 2016
  venue: "Journal of Computational Chemistry, 37(6), 595-601"
  doi: "10.1002/jcc.24015"
  path: references/papers/nihms-706794.md
  tags: [enhanced-sampling, langevin, detailed-balance, guiding-force, canonical-ensemble, GLE, fluctuation-dissipation, reweighting]
  key_terms:
    - "guiding force g_i -- extra force on low-frequency (running-averaged) momentum that accelerates slow modes without changing the energy surface or temperature"
    - "low-frequency momentum p-tilde -- exponential running average of momentum over a local-averaging time t_L; acts as a low-pass filter"
    - "guiding factor lambda -- strength of the guiding force; energy-conservation factor xi cancels net work"
    - "memory kernel K(t-tau) -- non-Markovian friction kernel of a generalized Langevin equation tied to noise by fluctuation-dissipation"
    - "SGLD-GLE -- modified random force restoring detailed balance so NVT/NPT are sampled exactly without reweighting"
    - "detailed-balance breaking -- plain SGLD is non-equilibrium; its stationary 'SGLD ensemble' is not known explicitly and needs reweighting"
  key_equations:
    - "SGLD EOM: pdot_i = f_i + g_i - gamma*p_i + R_i, with <R_i(0)R_j(t)> = 2*m_i*kT*gamma*delta(t)*delta_ij"
    - "Guiding force: g_i = lambda*gamma*p-tilde_i - xi*gamma*p_i (xi cancels net work)"
    - "GLE form: pdot_i = f_i - gamma * integral K(t-tau) p_i(tau) dtau + eta_i, with <eta_i(t)eta_j(t')> = delta_ij*m_i*kT*gamma*K(t-t')"
    - "Detailed-balance-restoring kernel: K(t) = 2*delta(t) - (lambda/t_L)*exp(-t/t_L), with lambda = mu*(2-mu)"
    - "Exact stationary density: rho ~ exp(-(1/kT)(E_p + sum_i(|p_i|^2/2m_i + t_L|g_i|^2/(2*m_i*gamma*mu^2))))"
  invariants:
    - "A guiding force that breaks detailed balance produces an unknown stationary distribution and requires reweighting to recover the canonical ensemble."
    - "Restoring detailed balance via fluctuation-dissipation (modifying the random force to match the friction kernel) recovers exact NVT/NPT sampling."
    - "The guiding force must do zero net work (orthogonal to momentum) to avoid heating/cooling the system."
  summary: >
    Shows how to accelerate low-frequency conformational motions with a guiding force while
    preserving the exact canonical distribution: ordinary self-guided Langevin dynamics
    breaks detailed balance (hence needs reweighting), but recasting it as a generalized
    Langevin equation whose noise satisfies fluctuation-dissipation (kernel
    K(t)=2*delta(t)-(lambda/t_L)exp(-t/t_L)) restores detailed balance and samples NVT/NPT
    exactly. The lesson maps directly onto the guidance-vs-acceptance Hamiltonian split:
    a distorted/guided proposal is legitimate only if the stationary target is preserved,
    otherwise a correction (reweighting or an acceptance test) is mandatory.
    Relevant to: enhanced-sampling moves and the guidance-vs-acceptance distinction in the HMC acceptance test.

- title: "Torsion Angle Dynamics: Reduced Variable Conformational Sampling Enhances Crystallographic Structure Refinement"
