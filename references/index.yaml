    articulated-body quantities (P, D) already produced by the constrained-dynamics solver. The key
    results det{M} = det{D} and T_c(k) = (1/2) Trace{M^-1 dM/dtheta(k)} are precisely the metric-tensor
    correction an internal-coordinate sampler must include to keep its stationary distribution unbiased.
    Relevant to: Fixman/U_Jacobian correction, mass-metric determinant, acceptance test.

