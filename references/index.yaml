    - "Modal velocity coordinates -- independent coordinates v in which the CICMD equipartition principle holds, enabling Boltzmann velocity assignment"
    - "Flying ice cube effect -- numerical drain of thermal energy into translational/low-frequency modes; shown to also arise with Nose-Hoover"
    - "CM velocity nulling -- composite-body spatial-inertia method to reset accumulated linear/angular momentum"
    - "Freeze-and-thaw / dynamic clustering -- on-the-fly coarse graining that rigidifies/releases DOF (e.g. STRIDE-detected secondary structure)"
    - "Nonseparable Hamiltonian -- kinetic energy depends on configuration, requiring RK4/Lobatto/CVODE rather than Verlet"
  key_equations:
    - "Thermal energy target: KE = (1/2)(N - 6) k T"
    - "Kinetic energy via factored mass matrix: KE = (1/2) theta_dot^* M theta_dot = (1/2) theta_dot^* [I + H Phi K] D [I + H Phi K]^* theta_dot"
    - "Modal velocity transform: v = D^(1/2) [I + H Phi K]^* theta_dot, with KE = (1/2) sum_k v(k)^2"
    - "Inverse transform: theta_dot = [I - H Psi K]^* D^(-1/2) v"
