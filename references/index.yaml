    engine of Rice-Brunger) to NMR structure calculation, folding extended strands to
    correct structures with higher success rate and efficiency than Cartesian MD or
    distance-geometry, even reaching B-form DNA. It demonstrates a concrete simulated
    annealing protocol over internal coordinates: high-T torsion MD (up to 50000 K) with
    a soft quartic nonbonded potential, slow cooling, then Cartesian relaxation. The work
    confirms that dihedral-space propagation with fixed bond lengths/angles is a robust,
    high-temperature conformational sampler, and flags the ribose ring-closure
    approximation that internal-coordinate codes must handle. Relevant to: torsion-space
    sampling moves, annealing schedules, and ring-closure handling in the multibody engine.
