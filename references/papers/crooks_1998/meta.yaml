key: crooks_1998
doc_type: methods
title: Nonequilibrium Measurements of Free Energy Differences for Microscopically Reversible
  Markovian Systems
authors:
- Crooks
year: '1998'
venue: Journal of Statistical Physics
doi: 10.1023/A:1023208217925
summary: Derives the Jarzynski work equality (mean of exp(-beta W) equals exp(-beta
  Delta F)) from two assumptions only - Markovian dynamics and microscopic reversibility
  (single-step detailed balance). Establishes generalized detailed balance for multi-step
  driven processes (forward/reverse path probability ratio = exp(-beta Q) = exp(beta W_d)
  with equilibrium endpoints), the work/heat/energy bookkeeping (Delta E = Q + W),
  and the isothermal-isobaric generalization to Gibbs free energy. Thermodynamic integration
  (slow) and thermodynamic perturbation (fast, Zwanzig) appear as limits. Foundation
  for the Crooks-work acceptance criterion used in nonequilibrium-switch replica exchange.
