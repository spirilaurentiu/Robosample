key: jain_2012_icmd_equipartition
doc_type: methods
title: "Equipartition Principle for Internal Coordinate Molecular Dynamics"
authors: [Jain, Park, Vaidehi]
year: "2012"
venue: "Journal of Chemical Theory and Computation (JCTC)"
doi: 10.1021/ct3002046
summary: >
  Derives an equipartition principle for internal-coordinate MD (BAT/TAMD) by
  introducing noncanonical modal velocity coordinates v = m*(theta) thetadot that
  decouple the configuration-dependent ICMD kinetic energy (M = m m*). In modal
  coordinates <v_i v_j> = kT delta_ij (each modal DOF carries kT/2), unlike the
  dense-coupled physical (theta, p) coordinates. Gives spatial-operator
  factorizations of the mass matrix and its inverse (M = [I+HphiK] D [I+HphiK]*)
  and O(N) recursive base-to-tip algorithms (Table 1) to transform between modal
  and physical velocities without forming M, m, or l. Provides a thermodynamically
  rigorous method for initializing ICMD velocities (constrained and unconstrained),
  replacing ad hoc projection, and a basis for internal-coordinate conformational
  entropy.
has_implementable_math: true
methods:
  - modal coordinate transformation (mass-matrix square-root factorization)
  - spatial operator mass-matrix factorization and inversion
  - O(N) recursive base-to-tip velocity transforms
  - generalized equipartition theorem
  - Fixman/log-det compensating potential
  - articulated-body (AB) forward dynamics operators
provides:
  - ICMD/TAMD velocity initialization from Boltzmann-distributed modal velocities
  - modal <-> physical velocity conversion algorithm (Table 1)
  - equipartition principle for internal coordinates (<v v*> = kT I)
  - constrained-model Cartesian->ICMD velocity mapping P = M^-1 H phi M^1/2
  - closed-form m(theta), l(theta) transformation matrices
