key: spiridon_2017_cdhmc_gibbs
doc_type: methods
title: "Hamiltonian Monte Carlo with Constrained Molecular Dynamics as Gibbs Sampling"
authors: [Spiridon, Minh]
year: "2017"
venue: "J. Chem. Theory Comput."
doi: 10.1021/acs.jctc.7b00570
summary: "Implements constrained-dynamics HMC (CDHMC) with the Fixman compensating potential and internal-coordinate equipartition, mixed with unconstrained HMC as Gibbs sampling moves, to achieve rigorous Boltzmann sampling of constrained (torsional/rigid-body) molecular systems and enhance sampling of macrocycles. Directly foundational to Robosample's blocked-Gibbs HMC over kinematic-tree mobilizers."
has_implementable_math: true
methods: [constrained-dynamics HMC, torsional molecular dynamics, rigid-body dynamics, Fixman compensating potential, mass metric tensor determinant, internal-coordinate equipartition velocity draw, velocity Verlet with constraint projection, Metropolis-Hastings acceptance, Gibbs sampling of alternating constraint sets, Shirts energy-histogram test]
provides: [CDHMC sampler, Fixman potential in acceptance Hamiltonian, distinct guidance vs acceptance potential scheme, mixed constrained/unconstrained Gibbs moves, mass-metric-tensor kinetic energy, constrained velocity-Verlet integrator loop, Boltzmann-validation fixtures]
