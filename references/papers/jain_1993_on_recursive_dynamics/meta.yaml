  - {label: "4.6", desc: "reduce per-atom Cartesian forces to per-body spatial force"}
  - {label: "A.2", desc: "6x6 spatial transformation matrix"}
  - {label: "A.4", desc: "6x6 spatial inertia of a rigid body"}
