key: jain_1993_on_recursive_dynamics
doc_type: methods
title: "A Fast Recursive Algorithm for Molecular Dynamics Simulation"
authors: [Jain, Vaidehi, Rodriguez]
year: "1993"
venue: "Journal of Computational Physics"
doi: null
summary: >
  O(N) recursive dynamics for internal-variable (rigid-cluster, tree-topology)
  molecular models via spatial operator algebra. Derives the Newton-Euler and
  innovations operator factorizations of the articulated-body mass matrix, a
  closed-form mass-matrix inverse, and a two-sweep (tip-to-base Riccati /
  base-to-tip) recursion for the generalized accelerations that avoids forming
  the mass matrix or a cubic linear solve. Also reduces per-atom Cartesian
  forces to per-body spatial forces. Core articulated-body solver Robosample
  uses for its robot/mobilizer kinematic trees.
has_implementable_math: true
methods: [spatial operator algebra, articulated-body inertia recursion,
  discrete Riccati recursion, Newton-Euler operator factorization,
  innovations operator factorization, closed-form mass-matrix inverse,
  tip-to-base and base-to-tip recursions, per-atom to per-body spatial force reduction]
provides: [O(N) recursive forward dynamics solver, generalized-acceleration recursion,
  spatial inertia and spatial transform operators, hinge/mobilizer matrix H,
  articulated-body mass matrix factorization and inverse, Coriolis and gyroscopic spatial forces]
key_equations:
