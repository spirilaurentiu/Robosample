key: wu_2012_rxsgld
doc_type: methods
title: "Replica exchanging self-guided Langevin dynamics for efficient and accurate conformational sampling"
authors: [Wu, Hodoscek, Brooks]
year: "2012"
venue: "Journal of Chemical Physics"
doi: 10.1063/1.4737094
summary: "Replica-exchange scheme (RXSGLD) whose stages differ in a self-guiding temperature rather than in temperature; the exchange probability is derived from the SGLD partition function so the base stage samples the canonical ensemble, giving much higher exchange acceptance than temperature replica exchange for large systems."
has_implementable_math: true
methods:
  - self-guided Langevin dynamics equation of motion
  - guiding force with energy-conservation factor
  - low-frequency exponential-moving-average filter
  - SGLD partition function and reweighting factor
  - self-guiding temperature
  - SGLD-based replica exchange acceptance probability
  - momentum and low-frequency-momentum rescaling on exchange
  - on-the-fly evolving-average estimation of SGLD factors
  - subset-indexing clustering (SIC)
provides:
  - RXSGLD replica-exchange sampler
  - SGLD guiding-force integrator step
  - canonical-ensemble reweighting from SGLD trajectory
  - exchange-probability rule for guided replicas
  - skewed double-well analytic test fixtures
