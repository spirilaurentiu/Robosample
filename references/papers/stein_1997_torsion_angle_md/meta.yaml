summary: "Torsion-angle-space (internal-coordinate) MD for NMR structure calculation from an extended strand, using a Bae-Haug body-recursion, flat-bottom NOE/dihedral restraints, a repulsive quartic vdW term, and Berendsen-coupled simulated annealing. Higher success rate and efficiency than Cartesian SA and metric-matrix DGSA, especially for large proteins and DNA."
