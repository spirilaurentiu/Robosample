key: vaidehi_1996_neimo_thermostat
doc_type: methods
title: "Constant Temperature Constrained Molecular Dynamics: The Newton-Euler Inverse Mass Operator Method"
authors: [Vaidehi, Jain, Goddard]
year: "1996"
venue: "Journal of Physical Chemistry"
doi: 10.1021/jp953043o
summary: "Extends the O(N) NEIMO internal-coordinate (torsional) constrained-MD solver to the Nose and Hoover thermostats, giving canonical-ensemble equations of motion with a friction-like term folded into the Coriolis force; characterizes the optimal thermostat relaxation time tau_s and shows 20-30 fs stable time steps (10x Cartesian)."
has_implementable_math: true
methods: [NEIMO articulated-body O(N) solver, innovations operator factorization, Nose thermostat, Hoover thermostat, modified leapfrog-Verlet predictor-corrector, torsional constrained MD]
provides: [NEIMO-Hoover equations of motion, thermostat friction coefficient update, tau_s selection rule, inverse mass matrix LDL^T factorization, recursive base-to-tips/tips-to-base sweeps, canonical-ensemble internal-coordinate MD]
