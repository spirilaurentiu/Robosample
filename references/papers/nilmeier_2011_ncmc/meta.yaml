key: nilmeier_2011_ncmc
doc_type: methods
title: "Nonequilibrium candidate Monte Carlo is an efficient tool for equilibrium simulation"
authors: [Nilmeier, Jerome P., Crooks, Gavin E., Minh, David D. L., Chodera, John D.]
year: "2011"
venue: PNAS
doi: 10.1073/pnas.1106094108
summary: "Nonequilibrium candidate Monte Carlo (NCMC): a Markov chain Monte Carlo framework where candidates are generated by a finite-time driven (nonequilibrium) switching protocol of interleaved perturbation and propagation kernels, then accepted with a Metropolis-Hastings rule whose exponent is the nonequilibrium work (plus a conditional path-action term) rather than the instantaneous energy difference. Enforces pathwise (super-)detailed balance with a mandatory momentum flip, preserving the exact equilibrium (or expanded-ensemble) distribution. Driving a subset of degrees of freedom while letting the rest relax converts otherwise-rejected moves into high-acceptance ones. Includes explicit path-action expressions for symplectic (Delta S = 0), reversible-MCMC (Delta S = -heat), Ermak-Yeh overdamped Langevin, and BBK Langevin propagators."
