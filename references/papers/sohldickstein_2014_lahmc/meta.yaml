summary: "HMC variant (LAHMC) that avoids rejection by extending trajectories with extra leapfrog steps; uses greedy transition probabilities satisfying the fixed point equation (generalized detailed balance) instead of Metropolis-Hastings, suppressing momentum flips and random-walk behavior. Drop-in replacement for an HMC sampler."
