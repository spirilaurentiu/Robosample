key: jain_1997_fixman_compensating_potential
doc_type: methods
title: "Compensating Mass Matrix Potential for Constrained Molecular Dynamics"
authors: [Jain]
year: "1997"
venue: "Journal of Computational Physics"
doi: 10.1006/jcph.1997.5731
summary: >
  Closed-form O(N) spatial-operator algorithm to compute the Fixman compensating
  (metric-tensor) potential Vc = 1/2 ln det M and its gradient (compensating hinge
  torque Tc) for tree-topology internal-coordinate constrained MD. Reduces the
  naive O(N^3) trace(M^-1 dM/dtheta) to a per-hinge O(N) recursion reusing
  articulated-body-inertia quantities (P, D, psi) from the NEIMO constrained
  dynamics solver; Vc becomes a sum of small hinge-inertia log-dets.
has_implementable_math: true
methods:
  - Fixman compensating potential
  - spatial operator algebra
  - articulated body inertia recursion
  - innovations (LDL*) factorization of mass matrix
  - Newton-Euler operator factorization
  - O(N) internal-coordinate constrained dynamics
  - Riccati/Kalman-filter recursion for multibody inertia
provides:
  - compensating mass-matrix potential Vc = 0.5 sum_i ln det D(i)
  - compensating hinge torque Tc(i) = -h(i)^T F[Q11+Q22]
  - mass matrix determinant identity det(M) = det(D)
  - O(N) compensating-torque recursion (Y(k) recursion)
  - mass matrix sensitivity dM/dtheta_i operator form
  - articulated body inertia recursion (P, D, G, K, psi)
key_equations:
  - {label: "2.9", desc: "Fixman modified potential Vc = 1/2 ln det M"}
  - {label: "2.14", desc: "naive compensating torque = 1/2 Trace{M^-1 dM/dtheta}"}
