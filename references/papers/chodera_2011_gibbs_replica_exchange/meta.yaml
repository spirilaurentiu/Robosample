key: chodera_2011_gibbs_replica_exchange
doc_type: methods
title: "Replica exchange and expanded ensemble simulations as Gibbs sampling: Simple improvements for enhanced mixing"
authors: [Chodera, Shirts]
year: "2011"
venue: "J. Chem. Phys."
doi: 10.1063/1.3660669
summary: "Casts replica exchange and expanded ensemble as Gibbs sampling on the joint (config, thermodynamic-state) distribution; replaces single neighbor-exchange state moves with independence sampling, Metropolized independence sampling, restricted-range sampling, and K^3-K^5 random pair-swap loops to accelerate state-space and configuration-space mixing at near-zero extra cost."
has_implementable_math: true
methods:
  - Gibbs sampling on (x,k) joint distribution
  - neighbor exchange state move
  - independence sampling of state index
  - Metropolized independence sampling
  - restricted-range state sampling
  - random pair-swap MCMC on permutation
  - empirical state transition matrix diagnostic
  - integrated autocorrelation time / statistical inefficiency
provides:
  - expanded-ensemble state-update rule pi(k|x)
  - replica-exchange permutation-update swap loop
  - Metropolis acceptance for pair swaps (Eq 24)
  - reduced-potential formalism u_k(x)
  - softcore Lennard-Jones alchemical potential
  - von Mises periodic umbrella bias
  - mixing-time metrics (tau_2, tau_ac, tau_end)
