key: spiridon_2020_robosample
doc_type: methods
title: "Robosample: A rigid-body molecular simulation program based on robot mechanics"
authors: [Spiridon, Sulea, Minh, Petrescu]
year: "2020"
venue: "BBA - General Subjects"
doi: 10.1016/j.bbagen.2020.129616
summary: >
  The primary Robosample paper. Constrained-dynamics Hamiltonian Monte Carlo
  (CDHMC) used as a Gibbs sampling move over alternating "worlds" (each a set of
  rigid bodies + joint types mapped onto the same molecular graph). Rigid bodies
  and joints (Cartesian, torsional, cylindrical=2DOF, spherical/ball=3DOF)
  distributed by the user; energies/forces from OpenMM reduced to per-body spatial
  forces solved by Simbody's O(N) Spatial Operator Algebra. Fixman potential/torque
  corrects the reduced-coordinate marginal to match fully flexible Boltzmann
  sampling. Validated on alanine dipeptide free-energy surface and an HCV E2N1 glycan.
has_implementable_math: true
methods: [constrained-dynamics HMC, Gibbs sampling over worlds, spatial operator algebra,
  Fixman potential correction, Fixman torque, mass matrix tensor determinant/gradient,
  spherical joint, cylindrical joint, torsional dynamics, Metropolis-Hastings acceptance,
  generalized-coordinate equipartition velocity init, HMC parameter tuning]
provides: [CDHMC Gibbs sampler, multi-world rigid-body sampling scheme, Fixman potential/torque,
  reduced-coordinate Hamiltonian, spherical and cylindrical mobilizers, joint-frame-along-bond convention,
  HMC acceptance-rate tuning workflow, per-body spatial force reduction]
