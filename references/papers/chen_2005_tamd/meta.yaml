key: chen_2005_tamd
doc_type: methods
title: "Application of Torsion Angle Molecular Dynamics for Efficient Sampling of Protein Conformations"
authors: [Chen, Im, Brooks]
year: "2005"
venue: "Journal of Computational Chemistry"
doi: 10.1002/jcc.20293
summary: "Torsion-angle MD (TAMD) via the recursive O(n) NEIMO / spatial-operator-algebra articulated-body solver, plus an extended projection method to build an internal-coordinate force field (ICFF) from a Cartesian force field using softened vdW/electrostatics and CMAP torsion crossterm corrections. Enables 10-20 fs time steps and ~10x fewer DOF for enhanced conformational sampling."
has_implementable_math: true
methods: [NEIMO recursive articulated-body dynamics, spatial operator algebra, Newton-Euler operator factorization, innovations operator factorization, O(n) mass-matrix inverse, per-cluster spatial force reduction, modified leapfrog Verlet integrator, quaternion base propagation, Berendsen thermostat, replica exchange MD, torsion crossterm CMAP correction, softened vdW/electrostatics]
provides: [internal-coordinate equations of motion, O(n) mass-matrix inversion, kinematic-tree rigid-body recursions, per-body spatial force from per-atom forces, internal-coordinate force field construction, energy-fluctuation integrator-accuracy metric, TAMD time-step benchmarks]
