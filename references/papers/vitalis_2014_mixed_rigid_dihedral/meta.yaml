key: vitalis_2014_mixed_rigid_dihedral
doc_type: methods
title: "A simple molecular mechanics integrator in mixed rigid body and dihedral angle space"
authors: [Vitalis, Pappu]
year: "2014"
venue: "J. Chem. Phys."
doi: 10.1063/1.4887339
summary: >
  Torsional/rigid-body MD integrator that replaces the full mass-metric tensor (MMT) with
  its diagonal (effective masses), decoupling every generalized DOF and integrating each by
  imposing per-DOF discrete energy conservation. Configurational sampling is free of MMT
  (Fixman) artifacts by construction - no det(G) evaluation - at the cost of correct dynamics.
  Provides O(N_at) inward/outward recursions for projected forces, effective inertias, and
  Cartesian velocities, a Z-matrix (NeRF) coordinate build, quaternion rigid-body rotation,
  and Andersen / velocity-rescaling thermostat coupling. Validated on TIP4P water and the FS
  helix-coil peptide against SETTLE-MD and REMC references.
has_implementable_math: true
methods:
  - diagonal mass-metric-tensor approximation
  - per-DOF energy-conserving velocity update (quadratic solve)
  - sub-stepped iterative velocity integrator (Lambda segments)
  - inward tip-to-base recursion for projected generalized force
  - inward recursion for diagonal effective inertia
  - outward base-to-tip recursion for Cartesian atomic velocities
  - Z-matrix to Cartesian placement (NeRF)
  - quaternion rigid-body rotation update
  - Andersen thermostat (per-DOF)
  - Bussi velocity-rescaling thermostat
provides:
  - torsional/rigid-body MD integrator free of MMT/Fixman artifacts
  - O(N_at) effective-mass and projected-force recursions
  - mixed dihedral + rigid-body generalized-coordinate propagator
  - diagonal effective-mass model for internal-coordinate kinetic energy
  - full integration cycle (Appendix C pseudocode)
