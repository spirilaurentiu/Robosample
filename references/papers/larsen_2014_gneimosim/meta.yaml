key: larsen_2014_gneimosim
doc_type: software
title: "GneimoSim: A Modular Internal Coordinates Molecular Dynamics Simulation Package"
authors: [Larsen, Wagner, Kandel, Salomon-Ferrer, Vaidehi, Jain]
year: "2014"
venue: "Journal of Computational Chemistry"
doi: 10.1002/jcc.23743
summary: >
  Software-description paper for GneimoSim, a modular C++/Python package
  implementing the GNEIMO internal-coordinate MD (ICMD) method: molecules modeled
  as clusters (rigid bodies) connected by 1-6 DOF hinges, solved with the SOA
  linear-cost (O(N)) recursive dynamics solver (DARTS). Adds ICMD equipartition
  velocity initialization, the Fixman correction potential/torque for
  constraint-bias-free sampling, dynamic freeze/thaw clustering, NVE/NVT
  (Nose-Hoover, Berendsen, Langevin) ensembles, REMD and aMD enhanced sampling,
  and pluggable third-party forcefields (LAMMPS, OpenMM, Rosetta). Routing paper:
  points at the underlying GNEIMO/SOA/Fixman/equipartition method papers.
has_implementable_math: false
