summary: "SGLD-GLE: a generalized Langevin equation that restores detailed balance in self-guided Langevin dynamics, so the NVT/NPT canonical ensemble is sampled exactly with no reweighting. Enhances low-frequency (conformational) motion while keeping the exact Boltzmann marginal; size-extensive, per-atom-tunable guiding factor."
