key: wyczalkowski_pappu_2008
doc_type: methods
title: Satisfying the fluctuation theorem in free-energy calculations with Hamiltonian
  replica exchange
authors:
- Wyczalkowski
- Pappu
year: '2008'
venue: Physical Review E
doi: 10.1103/PhysRevE.77.026104
summary: Defines the hysteresis error (difference between forward and reverse FEP
  estimators) as a directly measurable sampling-quality metric derived from the Crooks
  fluctuation theorem, and shows Hamiltonian replica exchange minimizes it by populating
  swapped configuration pairs so the interreplica equilibrium relation rho_N'/rho_N
  = exp(-beta dU_swap) is satisfied. Relates the average swap probability to the overlap
  of neighboring equilibrium ensembles and to the rate at which the hysteresis error
  falls; the linearized swap probability 1/2 - (beta^2 delta^2/4) C_lambda with C_lambda
  = var(dU/dlambda) gives a criterion for building an optimal lambda schedule. Demonstrated
  on the free energy of hydration of acetamide.
has_implementable_math: true
methods:
- Hamiltonian replica exchange
- free-energy perturbation (forward/reverse FEP)
- Bennett acceptance ratio
- Crooks fluctuation theorem
- Metropolis swap acceptance
- Fermi swap probability
- dissipated-work bookkeeping
- linear-response Taylor expansion of swap probability
- soft-core lambda-scaled Coulomb/Lennard-Jones potentials
- bootstrap error estimation
provides:
- hysteresis error metric eps_H = dF_FEP^F - dF_FEP^R
- interreplica equilibrium relation rho_N'/rho_N = exp(-beta dU_swap)
- swap energy dU_swap = W^F + W^R = W_D^F + W_D^R
- Metropolis and Fermi swap acceptance rules
- average swap probability as ensemble-overlap integral
- linearized swap probability with C_lambda = var(dU/dlambda)
- optimal lambda-schedule criterion (uniform swap probability)
- soft-core scaled Coulomb (eq B1) and Lennard-Jones (eq B2, B3a, B3b)
- Jarzynski identity form <exp(-beta W_D^F)>_0 = 1
