key: pear_1979_brownian_rigid_chain
doc_type: methods
title: "Brownian dynamics study of a polymer chain of linked rigid bodies"
authors: [Pear, Weiner]
year: "1979"
venue: "J. Chem. Phys. 71, 212"
doi: 10.1063/1.438119
summary: >
  Brownian (Langevin) dynamics of a macromolecule backbone modeled as linked rigid
  bodies via the Wittenburg formalism, satisfying bond-length and valence-angle
  constraints exactly. Derives the articulated generalized mass matrix A and force
  vector B (A*phidotdot=B) with per-atom Langevin/damping forces reduced to per-body
  spatial moments. Shows the rigid-model dihedral distribution carries a metric
  determinant sqrt(g) absent from the flexible model, and that a Fixman compensating
  potential U=kT*ln(sqrt(g)) restores the flexible (uniform) distribution. Gives exact
  transition-state barrier-crossing rate formulas (with and without stress) for the
  three-bond 90-degree chain.
has_implementable_math: true
methods: [Wittenburg linked-rigid-body dynamics, articulated generalized mass matrix,
  per-atom force to per-body spatial moment reduction, Langevin/Brownian dynamics,
  Runge-Kutta plus random-impulse integrator, Fixman compensating potential,
  metric-determinant computation, transition-state rate theory, Bryant-angle orientation]
provides: [generalized mass matrix A and force vector B for a kinematic chain,
  hinge-axis projection formulas, augmented-body inertia tensors and body vectors,
  metric determinant g(phi) closed form for 3-bond 90-deg chain, Fixman potential,
  exact transition-state barrier-crossing rate formulas, stress-dependent rate formula,
  flexible-model harmonic bond/angle/dihedral force expressions]
