{% set name = "robosample" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  path: ..   # build from local repo (relative to recipe/). Alternatively use git_url & git_rev.

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - ninja
    - pkg-config
    - python=3.12 # requested by boa
    - blas
    - lapack
  host:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - cmake
    - ninja
    - pkg-config
    - python=3.12 # requested by boa
    - blas
    - lapack
  run:
    - python=3.12 # requested by boa
    - blas
    - lapack
    - numpy
    - scipy
    - pandas
    - matplotlib
    - openmm
    - openmmtools
    - mdtraj
    - mdanalysis
    - ambertools
    - parmed
    - rdkit
#    - openbabel
    - biopython
    - seaborn
    - astropy
    - networkx
    - tqdm
    - modeller

about:
  home: "https://your.repo/url"
  license: "BSD-3-Clause"
  summary: "RoboSample C++/pybind11 Python bindings"

