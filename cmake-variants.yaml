buildType:
  default: debug
  choices:
    debug:
      short: Debug
      long: Build debug version of Robosample Python library
      buildType: Debug
    release:
      short: Release
      long: Build release (no PGO and no LLVM-BOLT) version of Robosample Python library
      buildType: Release
    RelWithDebInfo:
      short: Release with Debug Info
      long: Build release version of Robosample Python library with debug symbols and frame pointers
      buildType: RelWithDebInfo
    pgo-train:
      short: PGO Train
      long: Run the instrumentation for Profile Guided Optimization
      buildType: PGO_Train
    pgo-use:
      short: PGO Use
      long: Use the generated instrumentation data for Profile Guided Optimization
      buildType: PGO_Use

openmmPlatform:
  default: cpu
  choices:
    cpu:
      short: CPU
      long: OpenMM CPU platform
      settings:
        USE_CPU: ON
    cuda:
      short: CUDA
      long: OpenMM CUDA platform
      settings:
        USE_CUDA: ON
        CMAKE_CUDA_ARCHITECTURES: native
        CMAKE_CUDA_COMPILER: /usr/local/cuda/bin/nvcc
    opencl:
      short: OpenCL
      long: OpenMM OpenCL platform
      settings:
        USE_OPENCL: ON
