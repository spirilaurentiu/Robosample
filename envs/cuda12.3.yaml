name: robo_cuda12.3
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - gcc_linux-64=12
  - gxx_linux-64=12
  - cuda-version=12.3
  - cuda-toolkit=12.3
  - openmm=8.1
  - pytorch-gpu=2.5
variables:
  OPENMM_CUDA_COMPILER: $CONDA_PREFIX/bin/nvcc
  CUDA_HOST_COMPILER: $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-g++
