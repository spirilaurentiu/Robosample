name: cuda12.5
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  # Compilers for this version of CUDA
  - gcc_linux-64=13.2
  - gxx_linux-64=13.2

  # Mark correct CUDA version
  - cuda-version=12.5

  # Requested by OpenMM
  - cudatoolkit=12.5

  # Equivalent to cuda-toolkit=12.5, but actually pulls correct versions
  - cuda-cccl=12.5
  - cuda-command-line-tools=12.5
  - cuda-compiler=12.5
  - cuda-cudart=12.5
  - cuda-cudart-dev=12.5
  - cuda-cuobjdump=12.5
  - cuda-cupti=12.5
  - cuda-cuxxfilt=12.5
  - cuda-driver-dev=12.5
  - cuda-gdb=12.5
  - cuda-libraries=12.5
  - cuda-libraries-dev=12.5
  - cuda-nsight=12.5
  - cuda-nvcc=12.5
  - cuda-nvdisasm=12.5
  - cuda-nvml-dev=12.5
  - cuda-nvprof=12.5
  - cuda-nvprune=12.5
  - cuda-nvrtc=12.5
  - cuda-nvrtc-dev=12.5
  - cuda-nvtx=12.5
  - cuda-nvvp=12.5
  - cuda-opencl=12.5
  - cuda-opencl-dev=12.5
  - cuda-profiler-api=12.5
  - cuda-samples=12.5
  - cuda-sanitizer-api=12.5
  - cuda-thrust=12.5
  - cuda-tools=12.5
  - cuda-version=12.5
  - cuda-visual-tools=12.5

# These variables are set on environment activation (i.e. after `conda activate XXX`)
# $CONDA_PREFIX resolves to the environment's root directory at that point,
# so these paths correctly point to the nvcc compiler and the GCC C++ host compiler
# bundled in this environment. OpenMM requires both to be explicitly set when
# building/running with CUDA support.
variables:
  OPENMM_CUDA_COMPILER: $CONDA_PREFIX/bin/nvcc
  CUDA_HOST_COMPILER: $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-g++
