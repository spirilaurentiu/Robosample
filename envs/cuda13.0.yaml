name: cuda13.0
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  # Compilers for this version of CUDA
  - gcc_linux-64=15
  - gxx_linux-64=15

  # Mark correct CUDA version
  - cuda-version=13.0

  # Requested by OpenMM
  - cudatoolkit=13.0

  # Equivalent to cuda-toolkit=13.0, but actually pulls correct versions
  - cuda-cccl=13.0
  - cuda-command-line-tools=13.0
  - cuda-compiler=13.0
  - cuda-cudart=13.0
  - cuda-cudart-dev=13.0
  - cuda-cuobjdump=13.0
  - cuda-cupti=13.0
  - cuda-cuxxfilt=13.0
  - cuda-driver-dev=13.0
  - cuda-gdb=13.0
  - cuda-libraries=13.0
  - cuda-libraries-dev=13.0
  - cuda-nsight=13.0
  - cuda-nvcc=13.0
  - cuda-nvdisasm=13.0
  - cuda-nvml-dev=13.0
  - cuda-nvprof=13.0
  - cuda-nvprune=13.0
  - cuda-nvrtc=13.0
  - cuda-nvrtc-dev=13.0
  - cuda-nvtx=13.0
  - cuda-nvvp=13.0
  - cuda-opencl=13.0
  - cuda-opencl-dev=13.0
  - cuda-profiler-api=13.0
  - cuda-samples=13.0
  - cuda-sanitizer-api=13.0
  - cuda-thrust=13.0
  - cuda-tools=13.0
  - cuda-version=13.0
  - cuda-visual-tools=13.0

# These variables are set on environment activation (i.e. after `conda activate XXX`)
# $CONDA_PREFIX resolves to the environment's root directory at that point,
# so these paths correctly point to the nvcc compiler and the GCC C++ host compiler
# bundled in this environment. OpenMM requires both to be explicitly set when
# building/running with CUDA support.
variables:
  OPENMM_CUDA_COMPILER: $CONDA_PREFIX/bin/nvcc
  CUDA_HOST_COMPILER: $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-g++
