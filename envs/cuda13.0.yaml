name: robo_cuda13.0
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.14
  - gcc_linux-64=15
  - gxx_linux-64=15
  - cuda-version=13.0
  - cuda-toolkit=13.0
  - openmm=8.5
  - pytorch-gpu=2.11
variables:
  OPENMM_CUDA_COMPILER: $CONDA_PREFIX/bin/nvcc
  CUDA_HOST_COMPILER: $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-g++
  LD_PRELOAD: $CONDA_PREFIX/lib/libatomic.so.1
