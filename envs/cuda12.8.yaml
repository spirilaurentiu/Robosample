name: robo_cuda12.8
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.13
  - gcc_linux-64=13
  - gxx_linux-64=13
  - cuda-version=12.8
  - cuda-toolkit=12.8
  - openmm=8.3
  - pytorch-gpu=2.7
variables:
  OPENMM_CUDA_COMPILER: $CONDA_PREFIX/bin/nvcc
  CUDA_HOST_COMPILER: $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-g++
