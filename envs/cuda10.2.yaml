name: cuda10.2
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  # Compilers for this version of CUDA
  - gcc_linux-64=8
  - gxx_linux-64=8

  # Mark correct CUDA version
  - cuda-version=10.2

  # Requested by OpenMM
  - cudatoolkit=10.2

  # Equivalent to cuda-toolkit=10.2, but actually pulls correct versions
  - cuda-command-line-tools=10.2
  - cuda-compiler=10.2
  - cuda-cudart=10.2
  - cuda-cuobjdump=10.2
  - cuda-cupti=10.2
  - cuda-cuxxfilt=10.2
  - cuda-gdb=10.2
  - cuda-libraries=10.2
  - cuda-libraries-dev=10.2
  - cuda-memcheck=10.2
  - cuda-nvcc=10.2
  - cuda-nvdisasm=10.2
  - cuda-nvprof=10.2
  - cuda-nvprune=10.2
  - cuda-nvrtc=10.2
  - cuda-nvtx=10.2
  - cuda-nvvp=10.2
  - cuda-sanitizer-api=10.2
  - cuda-thrust=10.2
  - cuda-tools=10.2
  - cuda-visual-tools=10.2

# These variables are set on environment activation (i.e. after `conda activate XXX`)
# $CONDA_PREFIX resolves to the environment's root directory at that point,
# so these paths correctly point to the nvcc compiler and the GCC C++ host compiler
# bundled in this environment. OpenMM requires both to be explicitly set when
# building/running with CUDA support.
variables:
  OPENMM_CUDA_COMPILER: $CONDA_PREFIX/bin/nvcc
  CUDA_HOST_COMPILER: $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-g++
