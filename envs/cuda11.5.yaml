name: cuda11.5
channels:
  - conda-forge
  - nvidia
  - nodefaults
dependencies:
  # Compilers for this version of CUDA
  - gcc_linux-64=11
  - gxx_linux-64=11

  # Mark correct CUDA version
  - cuda-version=11.5

  # Requested by OpenMM
  - cudatoolkit=11.5

  # Equivalent to cuda-toolkit=11.5, but actually pulls correct versions
  - cuda-cccl=11.5
  - cuda-command-line-tools=11.5
  - cuda-compiler=11.5
  - cuda-cudart=11.5
  - cuda-cudart-dev=11.5
  - cuda-cuobjdump=11.5
  - cuda-cupti=11.5
  - cuda-cuxxfilt=11.5
  - cuda-driver-dev=11.5
  - cuda-gdb=11.5
  - cuda-libraries=11.5
  - cuda-libraries-dev=11.5
  - cuda-nsight=11.5
  - cuda-nvcc=11.5
  - cuda-nvdisasm=11.5
  - cuda-nvml-dev=11.5
  - cuda-nvprof=11.5
  - cuda-nvprune=11.5
  - cuda-nvrtc=11.5
  - cuda-nvrtc-dev=11.5
  - cuda-nvtx=11.5
  - cuda-nvvp=11.5
  - cuda-opencl=11.5
  - cuda-opencl-dev=11.5
  - cuda-profiler-api=11.5
  - cuda-samples=11.5
  - cuda-sanitizer-api=11.5
  - cuda-thrust=11.5
  - cuda-tools=11.5
  - cuda-version=11.5
  - cuda-visual-tools=11.5

# These variables are set on environment activation (i.e. after `conda activate XXX`)
# $CONDA_PREFIX resolves to the environment's root directory at that point,
# so these paths correctly point to the nvcc compiler and the GCC C++ host compiler
# bundled in this environment. OpenMM requires both to be explicitly set when
# building/running with CUDA support.
variables:
  OPENMM_CUDA_COMPILER: $CONDA_PREFIX/bin/nvcc
  CUDA_HOST_COMPILER: $CONDA_PREFIX/bin/x86_64-conda-linux-gnu-g++
