name: robo_py312
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Build tools
  - cmake
  - ninja
  - pkg-config
  - gcc_linux-64
  - gxx_linux-64

  # Python
  - python=3
  - pip

  # Coding tools
  - gtest

  # Hardware acceleration requested and installed by OpenMM
  # This happens regardless of the underlying hardware
  - ocl-icd
  - ocl-icd-system
  - opencl-headers
  - clinfo
  - rocm-core

  # OpenMP support for GNU and LLVM compilers
  - libgomp

  # Bioinformatics
  - openmm
  - parmed
  - mdtraj
  - mdanalysis

  # Scientific computing and data analysis
  - numpy
  - scipy
  - astropy
  - networkx
  - tqdm
  - hypothesis

  # Pip packages
  - pip:
    - pybind11-stubgen
    - pytest
    - pytest-xdist
    - pytest-cov
    - gcovr
    - coverage
    - anybadge
    - nox
    - pre-commit
    - clang-tidy
    - clang-format
    - cmake-format
    - scikit-build-core
    - python-louvain
